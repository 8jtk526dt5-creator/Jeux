<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON COAST – Monde ouvert</title>
<style>
html,body{margin:0;height:100%;background:#120a22;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   NEON COAST — jeu de monde ouvert original (vue du dessus, caméra qui
   tourne avec la voiture, bâtiments en pseudo-3D, coucher de soleil néon)
   Canvas 2D pur, zéro dépendance, pensé pour iPhone.
   ===================================================================== */
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=300,H=300,DPR=1;
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261119);
const rr=(x,y,w,h,r)=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()};
const money=n=>'$'+Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* ============================ MONDE ============================ */
const TS=50,N=72,WS=N*TS,I0=6,I1=63;
const TW=0,TSd=1,TR=2,TSW=3,TB=4,TG=5;
const tiles=new Uint8Array(N*N),depth=new Uint8Array(N*N),tileB=new Int16Array(N*N).fill(-1);
const isRL=t=>t>=I0&&t<=I1&&((t-I0)&7)<2;
const IC=k=>(I0+8*k)*TS+50;               // centre d'intersection
const nearIdx=v=>clamp(Math.round((v-IC(0))/400),0,7);
const buildings=[],palms=[],umbrellas=[],fountains=[],parkedSpots=[];
const PAL=[[255,105,180],[40,220,205],[255,170,90],[150,110,255],[245,235,215],[90,170,255],[255,90,110],[120,230,160]];
const NEON=['#ff3fa4','#2ff0ff','#ffd23f','#b86bff','#5dff9b'];
const LOTS=[[1,2],[4,5],[5,0],[2,4],[3,6],[0,5]];
function blockType(kx,ky){
  if(kx===6)return 'beach';
  if(LOTS.some(l=>l[0]===kx&&l[1]===ky))return 'lot';
  if((kx===2&&ky===3)||(kx===4&&ky===1)||(kx===1&&ky===6)||(kx===5&&ky===4))return 'park';
  return 'bldg';
}
(function gen(){
  for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
    const i=ty*N+tx;let t;
    if(tx>=I0&&tx<=I1&&ty>=I0&&ty<=I1){
      if(isRL(tx)||isRL(ty))t=TR;
      else{
        const kx=(tx-8)>>3,ky=(ty-8)>>3,lx=(tx-I0)%8-2,ly=(ty-I0)%8-2;
        const bt=blockType(kx,ky);
        if(lx===0||lx===5||ly===0||ly===5)t=(bt==='beach'&&lx===5)?TSd:TSW;
        else t=bt==='bldg'?TB:bt==='park'?TG:bt==='beach'?TSd:TR;
      }
    }else{
      const dx=Math.max(I0-tx,tx-I1,0),dy=Math.max(I0-ty,ty-I1,0),d=Math.max(dx,dy);
      if(d<=2||(d===3&&R()<.55)){t=TSd;depth[i]=0}else{t=TW;depth[i]=Math.min(9,d+1)}
    }
    tiles[i]=t;
  }
  // bâtiments
  for(let ky=0;ky<7;ky++)for(let kx=0;kx<7;kx++){
    const bt=blockType(kx,ky),tx0=8+kx*8,ty0=8+ky*8;
    if(bt==='bldg'){
      const down=Math.abs(kx-3)<=1&&Math.abs(ky-3)<=1;
      const pat=(kx===0&&ky===0)?0:Math.floor(R()*4);
      let rects=pat===0?[[0,0,4,4]]:pat===1?[[0,0,2,4],[2,0,2,4]]:pat===2?[[0,0,4,2],[0,2,4,2]]:[[0,0,2,2],[2,0,2,2],[0,2,2,2],[2,2,2,2]];
      for(const q of rects){
        const z=down?150+R()*310:70+R()*170;
        const id=buildings.length,col=PAL[Math.floor(R()*PAL.length)];
        const b={x:(tx0+1+q[0])*TS,y:(ty0+1+q[1])*TS,w:q[2]*TS,h:q[3]*TS,z:z,col:col,neon:NEON[Math.floor(R()*NEON.length)],ant:z>300&&R()<.7,hosp:kx===0&&ky===0};
        b.cx=b.x+b.w/2;b.cy=b.y+b.h/2;buildings.push(b);
        for(let yy=0;yy<q[3];yy++)for(let xx=0;xx<q[2];xx++)tileB[(ty0+1+q[1]+yy)*N+tx0+1+q[0]+xx]=id;
      }
    }
    if(bt==='bldg'||bt==='beach'||bt==='park'){
      // palmiers aux coins des trottoirs
      for(const [ax,ay] of [[0,0],[5,0],[0,5],[5,5]])palms.push({x:(tx0+ax+.5)*TS,y:(ty0+ay+.5)*TS,z:70+R()*30,r:R()*6});
    }
    if(bt==='park'){
      for(let i=0;i<7;i++)palms.push({x:(tx0+1.2+R()*3.6)*TS,y:(ty0+1.2+R()*3.6)*TS,z:80+R()*40,r:R()*6});
      fountains.push({x:(tx0+3)*TS,y:(ty0+3)*TS});
    }
    if(bt==='beach'){
      for(let i=0;i<9;i++)palms.push({x:(tx0+1+R()*4)*TS,y:(ty0+1+R()*4)*TS,z:80+R()*40,r:R()*6});
      for(let i=0;i<5;i++)umbrellas.push({x:(tx0+1.3+R()*3.4)*TS,y:(ty0+1.3+R()*3.4)*TS,c:NEON[i%5]});
    }
    if(bt==='lot'){
      for(let col=0;col<4;col++)for(let row=0;row<2;row++)parkedSpots.push({x:(tx0+1.5+col)*TS,y:(ty0+1.2+row*2.4+.3)*TS,lot:kx+','+ky});
    }
  }
  // palmiers sur le sable ouest/sud
  for(let i=0;i<60;i++){
    const x=R()*WS,y=R()*WS;const tx=Math.floor(x/TS),ty=Math.floor(y/TS);
    if(tiles[ty*N+tx]===TSd&&(tx<I0||ty<I0||tx>I1||ty>I1))palms.push({x,y,z:80+R()*40,r:R()*6});
  }
})();
const HOSP={x:11*TS,y:13.5*TS};
const solidTile=(tx,ty)=>{if(tx<0||ty<0||tx>=N||ty>=N)return true;const t=tiles[ty*N+tx];return t===TB||t===TW};
const solidPx=(x,y)=>solidTile(Math.floor(x/TS),Math.floor(y/TS));
function pushOut(o,r){
  let hn=null;
  const x0=Math.floor((o.x-r)/TS),x1=Math.floor((o.x+r)/TS),y0=Math.floor((o.y-r)/TS),y1=Math.floor((o.y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(!solidTile(tx,ty))continue;
    const cx=clamp(o.x,tx*TS,tx*TS+TS),cy=clamp(o.y,ty*TS,ty*TS+TS);
    let dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
    if(d2<r*r){
      let d=Math.sqrt(d2);
      if(d<.001){dx=o.x-(tx*TS+25);dy=o.y-(ty*TS+25);d=Math.hypot(dx,dy)||1;}
      const nx=dx/d,ny=dy/d,push=(d2<.001?r+TS/2:r-d);
      o.x+=nx*push;o.y+=ny*push;hn={x:nx,y:ny};
    }
  }
  return hn;
}
function hasLOS(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/24);
  for(let i=1;i<n;i++){const t=i/n;if(solidPx(lerp(x0,x1,t),lerp(y0,y1,t)))return false}
  return true;
}
const inInter=(x,y)=>isRL(Math.floor(x/TS))&&isRL(Math.floor(y/TS));
const DX=[1,0,-1,0],DY=[0,1,0,-1];
function randRoadPoint(){
  const horiz=Math.random()<.5,k=ri(0,7),pos=rnd(I0*TS+120,(I1+1)*TS-120),band=(I0+8*k)*TS;
  if(horiz){const e=Math.random()<.5;return{x:pos,y:band+(e?75:25),dir:e?0:2}}
  const s=Math.random()<.5;return{x:band+(s?25:75),y:pos,dir:s?1:3};
}
function districtName(x,y){
  const kx=((x/TS-8)/8)|0,ky=((y/TS-8)/8)|0;
  if(x>(I1-6)*TS)return 'PLAGE DU COUCHANT';
  if(x<I0*TS||y<I0*TS||x>(I1+1)*TS||y>(I1+1)*TS)return 'CÔTE OUEST';
  if(Math.abs(kx-3)<=1&&Math.abs(ky-3)<=1)return 'CENTRE AQUA';
  if(ky<=1)return 'QUARTIER NÉON';
  if(kx<=1)return 'MARINA FLAMINGO';
  return 'LITTLE PALMA';
}
// mini-carte pré-rendue
const mm=document.createElement('canvas');mm.width=mm.height=432;
(function(){
  const m=mm.getContext('2d'),s=6;
  const col=[ '#1d7fb0','#d8c18c','#6a6488','#4d4568','#b4509b','#2a9a68' ];
  for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
    const t=tiles[ty*N+tx];m.fillStyle=col[t];
    if(t===TW)m.fillStyle=depth[ty*N+tx]>5?'#145f8a':'#1d7fb0';
    m.fillRect(tx*s,ty*s,s+.5,s+.5);
  }
})();

/* ============================ AUDIO ============================ */
let AC=null,master,musicG,sfxG,engOsc,engG,engF,sirOsc,sirG,noiseBuf,muted=false,nextT=0,stepI=0;
const BPM=102,STEP=60/BPM/4,ROOTS=[45,41,48,43],TRI=[[0,3,7],[0,4,7],[0,4,7],[0,4,7]];
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
    musicG=AC.createGain();musicG.gain.value=.55;musicG.connect(master);
    sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
    const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    engOsc=AC.createOscillator();engOsc.type='sawtooth';engF=AC.createBiquadFilter();engF.type='lowpass';engF.frequency.value=420;
    engG=AC.createGain();engG.gain.value=0;engOsc.connect(engF);engF.connect(engG);engG.connect(sfxG);engOsc.start();
    sirOsc=AC.createOscillator();sirOsc.type='square';sirG=AC.createGain();sirG.gain.value=0;sirOsc.connect(sirG);sirG.connect(sfxG);sirOsc.start();
    nextT=AC.currentTime+.1;
    setInterval(musicTick,80);
  }catch(e){AC=null}
}
function note(t,f,dur,type,vol,cut,dest){
  const o=AC.createOscillator(),gn=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(cut,t);fl.frequency.exponentialRampToValueAtTime(Math.max(150,cut*.25),t+dur);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.012);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(fl);fl.connect(gn);gn.connect(dest||musicG);o.start(t);o.stop(t+dur+.05);
}
function noiseHit(t,dur,vol,type,freq,dest){
  const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=freq;
  const gn=AC.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(gn);gn.connect(dest||sfxG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
}
function kick(t){
  const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  gn.gain.setValueAtTime(.8,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(gn);gn.connect(musicG);o.start(t);o.stop(t+.3);
}
function musicTick(){
  if(!AC)return;
  if(muted||state!=='play'){nextT=AC.currentTime+.1;return}
  while(nextT<AC.currentTime+.3){
    const s=stepI&63,bar=(s>>4)&3,st=s&15,root=ROOTS[bar],t=nextT;
    if(st%4===0)kick(t);
    if(st===4||st===12)noiseHit(t,.16,.22,'highpass',1800,musicG);
    if(st%2===1)noiseHit(t,.04,.07,'highpass',7000,musicG);
    if(st%2===0)note(t,mf(root),STEP*1.8,'sawtooth',.2,800,musicG);
    const iv=TRI[bar],ai=[0,1,2,1,2,1,0,1][st&7]+(st>7?1:0);
    note(t,mf(root+24+iv[ai%3]+(ai>2?12:0)),STEP*.9,'square',.045,2600,musicG);
    if(st===0)for(const v of iv)note(t,mf(root+12+v),STEP*15,'triangle',.05,900,musicG);
    nextT+=STEP;stepI++;
  }
}
function sfxShot(){if(!AC||muted)return;const t=AC.currentTime;noiseHit(t,.13,.5,'lowpass',2600);note(t,180,.1,'square',.12,1500,sfxG)}
function sfxBoom(){if(!AC||muted)return;const t=AC.currentTime;noiseHit(t,.9,.9,'lowpass',500)}
function sfxCrash(v){if(!AC||muted)return;noiseHit(AC.currentTime,.2,clamp(v/400,.1,.6),'lowpass',1400)}
function sfxCash(){if(!AC||muted)return;const t=AC.currentTime;note(t,1318,.12,'sine',.12,5000,sfxG);note(t+.07,1760,.2,'sine',.12,5000,sfxG)}
function sfxHonk(){if(!AC||muted)return;const t=AC.currentTime;note(t,330,.35,'square',.07,1800,sfxG);note(t,415,.35,'square',.06,1800,sfxG)}
function audioUpdate(){
  if(!AC)return;const t=AC.currentTime;
  const c=P.car,sp=c?Math.hypot(c.vx,c.vy):0;
  engOsc.frequency.setTargetAtTime(34+sp*.2+(c&&c.boost?20:0),t,.06);
  engG.gain.setTargetAtTime(c&&!muted?.08+Math.min(.07,sp/5000):0,t,.1);
  let dmin=9999;for(const k of cars)if(k.mode==='cop'){const d=Math.hypot(k.x-P.x,k.y-P.y);if(d<dmin)dmin=d}
  sirG.gain.setTargetAtTime(dmin<900&&!muted?clamp(1-dmin/900,0,1)*.035:0,t,.1);
  sirOsc.frequency.value=(Math.floor(gameT*2.2)&1)?720:960;
}

/* ============================ ENTITÉS ============================ */
const SPEC={
  sedan:{l:52,w:26,top:300,acc:230,hp:100,cols:['#e84a5f','#3fb8af','#f7b32b','#6c5ce7','#dfe6e9','#2d98da','#ff7f50']},
  sport:{l:50,w:25,top:480,acc:370,hp:90,cols:['#ff2e93','#00e5ff','#ffd400','#ff5b1f','#9cff3a']},
  taxi:{l:52,w:26,top:290,acc:230,hp:100,cols:['#ffcc00']},
  van:{l:62,w:28,top:250,acc:190,hp:130,cols:['#f1f1f1','#7bdff2','#b2f7ef','#c8a2ff']},
  cop:{l:52,w:26,top:430,acc:340,hp:110,cols:['#1b1b2b']}
};
let cars=[],peds=[],bullets=[],parts=[],skids=[],pickups=[],toasts=[];
let state='title',gameT=0,hour=18.7,shake=0,redFlash=0,spawnT=0,heat=0,helpT=14,districtT=0,lastDistrict='';
const P={x:825,y:1325,a:-Math.PI/2,hp:100,car:null,money:500,wanted:0,shootT:0,anim:0,dead:false,deadT:0,vx:0,vy:0,face:-Math.PI/2,kills:0};
const cam={x:825,y:1325,head:-Math.PI/2,z:1};
let rot=0,M=null,actEdge=false,nearCar=null,nearGiv=null;

function mkCar(type,x,y,a,mode,color){
  const spec=SPEC[type];
  const c={type,spec,x,y,a,vx:0,vy:0,color:color||pick(spec.cols),hp:spec.hp,mode,dir:0,sp:0,cruise:rnd(120,190),decided:false,
    driver:mode==='ai'||mode==='cop',freeT:0,nitroE:100,boost:false,burnT:0,dead:false,stuckT:0,revT:0,unloaded:false,losT:0,los:true,tx:0,ty:0,slip:0,idleT:0};
  cars.push(c);return c;
}
function mkPed(kind,x,y){
  const p={x,y,a:rnd(0,TAU),hp:kind==='civ'?30:kind==='cop'?60:45,kind,dead:false,deadT:0,flee:0,fa:0,timer:rnd(.5,3),idle:0,spd:rnd(28,46),
    col:kind==='cop'?'#1d3a8a':kind==='gang'?'#8a1d7a':pick(['#ff7ab8','#35d6c8','#ffc857','#8f7bff','#f4f4f4','#ff6b6b','#5fb7ff']),
    skin:pick(['#f1c9a0','#d9a273','#a8744b','#7a4d2f','#f8dcc0']),hair:pick(['#111','#4a2c17','#c9a15a','#7a1f1f','#222']),
    shootT:rnd(.4,1),hostile:kind==='cop',walk:rnd(0,6)};
  peds.push(p);return p;
}
function addPickup(kind,x,y){pickups.push({kind,x,y,t:0,val:kind==='cash'?ri(1,4)*100:35,home:true})}
function spawnPickups(){
  let tries=0,cash=0,hp=0;
  while((cash<24||hp<7)&&tries++<4000){
    const tx=ri(I0,I1),ty=ri(I0,I1);
    if(tiles[ty*N+tx]!==TSW)continue;
    const x=(tx+.5)*TS,y=(ty+.5)*TS;
    if(cash<24){addPickup('cash',x,y);cash++}else{addPickup('hp',x,y);hp++}
  }
}
function setupWorld(){
  cars=[];peds=[];pickups=[];bullets=[];parts=[];
  // voitures garées dans les parkings
  const slots=parkedSpots.slice();
  for(let i=slots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]]}
  // première voiture garantie près du départ (parking 1,2)
  const lot12=parkedSpots.filter(s=>s.lot==='1,2');
  const first=lot12[0];
  mkCar('sport',first.x,first.y,-Math.PI/2,'idle','#ff2e93');
  mkCar('sedan',lot12[1].x,lot12[1].y,Math.PI/2,'idle','#2dd4d4');
  mkCar('taxi',lot12[2].x,lot12[2].y,-Math.PI/2,'idle');
  for(const s of slots){
    if(s.lot==='1,2')continue;if(Math.random()<.4)continue;
    mkCar(pick(['sedan','sedan','sport','van','taxi']),s.x,s.y,Math.random()<.5?-Math.PI/2:Math.PI/2,'idle');
  }
  spawnPickups();
  for(let i=0;i<20;i++)spawnPed(true);
  for(let i=0;i<14;i++)spawnTraffic(true);
}
function spawnTraffic(any){
  for(let k=0;k<12;k++){
    const r=randRoadPoint();if(inInter(r.x,r.y))continue;
    const d=Math.hypot(r.x-P.x,r.y-P.y);
    if(!any&&(d<650||d>1100))continue;if(any&&d<220)continue;
    let ok=true;for(const c of cars)if(Math.abs(c.x-r.x)<70&&Math.abs(c.y-r.y)<70){ok=false;break}
    if(!ok)continue;
    const type=pick(['sedan','sedan','sedan','taxi','van','sport']);
    const c=mkCar(type,r.x,r.y,r.dir*Math.PI/2,'ai');c.dir=r.dir;c.sp=c.cruise;c.vx=DX[r.dir]*c.sp;c.vy=DY[r.dir]*c.sp;return;
  }
}
function spawnPed(any){
  for(let k=0;k<14;k++){
    const a=rnd(0,TAU),d=any?rnd(120,1400):rnd(520,950);
    const x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    const tx=Math.floor(x/TS),ty=Math.floor(y/TS);
    if(tx<0||ty<0||tx>=N||ty>=N)continue;
    const t=tiles[ty*N+tx];if(t!==TSW&&t!==TSd&&t!==TG)continue;
    if(t===TSd&&(tx<I0||ty<I0||tx>I1||ty>I1))continue;
    mkPed('civ',(tx+.2+Math.random()*.6)*TS,(ty+.2+Math.random()*.6)*TS);return;
  }
}

/* ============================ ENTRÉES ============================ */
const keys={};
const stick={on:false,id:-1,ox:0,oy:0,x:0,y:0,dx:0,dy:0};
const held={fire:false,brake:false};
const btns={};
let sc=1;
function layout(){
  sc=clamp(Math.min(W,H)/390,.85,1.3);
  btns.act={x:W-78*sc,y:H-118*sc,r:46*sc,id:-1};
  btns.fire={x:W-176*sc,y:H-62*sc,r:38*sc,id:-1};

function driveCar(c,dt,thr,steer,hb){
  const s=c.spec,top=s.top*(c.boost?1.35:1),acc=s.acc*(c.boost?2.2:1);
  let fx=Math.cos(c.a),fy=Math.sin(c.a),vf=c.vx*fx+c.vy*fy;
  const sgn=vf>=0?1:-1,k=Math.min(1,Math.abs(vf)/90),rate=2.7*(1-.5*Math.min(1,Math.abs(vf)/top));
  c.a+=steer*rate*k*sgn*dt*(hb?1.45:1);
  fx=Math.cos(c.a);fy=Math.sin(c.a);
  vf=c.vx*fx+c.vy*fy;let vs=-c.vx*fy+c.vy*fx;
  if(thr>.02){vf+=thr*acc*Math.max(0,1-Math.max(0,vf)/top)*dt*1.15;if(vf<0)vf+=thr*acc*1.5*dt}
  else if(thr<-.02){if(vf>12)vf+=thr*acc*1.7*dt;else vf+=thr*acc*.6*dt*Math.max(0,1-(-vf)/(top*.35))}
  else{const d=140*dt;vf=Math.abs(vf)<d?0:vf-Math.sign(vf)*d}
  vf*=Math.exp(-.12*dt);vs*=Math.exp(-(hb?1.4:8)*dt);if(hb)vf*=Math.exp(-.9*dt);
  c.vx=fx*vf-fy*vs;c.vy=fy*vf+fx*vs;c.x+=c.vx*dt;c.y+=c.vy*dt;c.slip=Math.abs(vs);
  const sp=Math.hypot(c.vx,c.vy);
  if((c.slip>70||(hb&&sp>110))&&skids.length<500&&Math.random()<.7){
    for(const sd of[-1,1]){const px=c.x-fx*c.spec.l*.3-fy*sd*c.spec.w*.4,py=c.y-fy*c.spec.l*.3+fx*sd*c.spec.w*.4;skids.push({x:px,y:py,t:10})}
  }
}
function carWalls(c){
  const s=c.spec,fx=Math.cos(c.a),fy=Math.sin(c.a);let worst=0;
  for(const off of[-s.l*.3,0,s.l*.3]){
    const bx=c.x+fx*off,by=c.y+fy*off,o={x:bx,y:by},n=pushOut(o,s.w*.52);
    if(n){c.x+=o.x-bx;c.y+=o.y-by;const vn=c.vx*n.x+c.vy*n.y;if(vn<0){c.vx-=1.35*vn*n.x;c.vy-=1.35*vn*n.y;worst=Math.max(worst,-vn)}}
  }
  if(worst>100){
    damageCar(c,(worst-90)*.12);sfxCrash(worst);spark(c.x,c.y,6);
    if(c===P.car){shake=Math.max(shake,Math.min(12,worst/30))}
  }
}
function damageCar(c,d){if(c.dead||d<=0)return;c.hp-=d;if(c.hp<=0)wreck(c)}
function wreck(c){
  c.dead=true;c.hp=0;const wasP=P.car===c;c.mode='wreck';c.burnT=24;c.color='#2a2630';c.driver=false;
  explode(c.x,c.y,wasP?'p':'x');
  if(wasP){P.car=null;P.x=c.x+Math.cos(c.a+1.57)*40;P.y=c.y+Math.sin(c.a+1.57)*40;pushOut(P,8);hurt(40)}

}
function exitCar(){
  const c=P.car;if(!c)return;
  const ang=c.a-Math.PI/2;
  P.x=c.x+Math.cos(ang)*(c.spec.w/2+14);P.y=c.y+Math.sin(ang)*(c.spec.w/2+14);
  if(solidPx(P.x,P.y)){P.x=c.x-Math.cos(ang)*(c.spec.w/2+14);P.y=c.y-Math.sin(ang)*(c.spec.w/2+14)}

}
function tryEnter(){

  if(!best)return;

function carCar(a,b){
  const rrg=(a.spec.l+b.spec.l)*.5;
  if(Math.abs(a.x-b.x)>rrg||Math.abs(a.y-b.y)>rrg)return;
  const ax=Math.cos(a.a),ay=Math.sin(a.a),bx=Math.cos(b.a),by=Math.sin(b.a);
  let hitn=null;
  for(const oa of[-a.spec.l*.3,0,a.spec.l*.3])for(const ob of[-b.spec.l*.3,0,b.spec.l*.3]){
    const x1=a.x+ax*oa,y1=a.y+ay*oa,x2=b.x+bx*ob,y2=b.y+by*ob,dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),md=(a.spec.w+b.spec.w)*.5*.95;
    if(d<md&&d>.01){
      const nx=dx/d,ny=dy/d,pen=(md-d)*.5;
      const aS=a.mode==='ai',bS=b.mode==='ai';
      if(aS&&!bS){b.x+=nx*pen*2;b.y+=ny*pen*2}else if(bS&&!aS){a.x-=nx*pen*2;a.y-=ny*pen*2}else{a.x-=nx*pen;a.y-=ny*pen;b.x+=nx*pen;b.y+=ny*pen}
      hitn={x:nx,y:ny};
    }
  }
  if(!hitn)return;
  const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vr=rvx*hitn.x+rvy*hitn.y;
  if(vr<0){
    const aAI=a.mode==='ai',bAI=b.mode==='ai';
    if(aAI&&bAI)return;
    const j=-(1.4)*vr/2;
    if(!aAI){a.vx-=j*hitn.x;a.vy-=j*hitn.y}
    if(!bAI){b.vx+=j*hitn.x;b.vy+=j*hitn.y}
    const imp=-vr;
    if(imp>60){
      if(aAI){a.mode='free';a.freeT=3}if(bAI){b.mode='free';b.freeT=3}
      if(imp>110){damageCar(a,(imp-100)*.1);damageCar(b,(imp-100)*.1);sfxCrash(imp);spark((a.x+b.x)/2,(a.y+b.y)/2,6);
        if(a===P.car||b===P.car)shake=Math.max(shake,Math.min(12,imp/30));
        if((a===P.car||b===P.car)&&(a.mode==='free'||b.mode==='free'))crimeSoft()}
    }
  }
}
function resumeAI(c){
  const ct=tiles[Math.floor(c.y/TS)*N+Math.floor(c.x/TS)];
  if(!c.driver||ct!==TR||!(isRL(Math.floor(c.x/TS))||isRL(Math.floor(c.y/TS)))){c.mode='idle';return}
  const a=((c.a%TAU)+TAU)%TAU;c.dir=Math.round(a/(Math.PI/2))&3;c.sp=Math.min(Math.hypot(c.vx,c.vy),c.cruise);c.decided=false;c.mode='ai';
}
function aiUpdate(c,dt){
  const dx=DX[c.dir],dy=DY[c.dir],horiz=(c.dir&1)===0;
  let tl,cur;
  if(horiz){const b=I0*TS+Math.round((c.y-I0*TS-50)/(8*TS))*8*TS;tl=b+(c.dir===0?75:25);cur=c.y}
  else{const b=I0*TS+Math.round((c.x-I0*TS-50)/(8*TS))*8*TS;tl=b+(c.dir===1?25:75);cur=c.x}
  let want=c.cruise;
  for(const o of cars){
    if(o===c)continue;const rx=o.x-c.x,ry=o.y-c.y,al=rx*dx+ry*dy;
    if(al>0&&al<100){const lat=Math.abs(-rx*dy+ry*dx);if(lat<27)want=Math.min(want,Math.max(0,(al-46)*3))}
  }
  for(const p of peds){if(p.dead)continue;const rx=p.x-c.x,ry=p.y-c.y,al=rx*dx+ry*dy;if(al>0&&al<90&&Math.abs(-rx*dy+ry*dx)<20)want=0}
  if(!P.car&&!P.dead){const rx=P.x-c.x,ry=P.y-c.y,al=rx*dx+ry*dy;if(al>0&&al<100&&Math.abs(-rx*dy+ry*dx)<22)want=0}

  const inter=inInter(c.x,c.y);

    c.decided=true;
    const bx=I0*TS+Math.round((c.x-I0*TS-50)/(8*TS))*8*TS+50,by=I0*TS+Math.round((c.y-I0*TS-50)/(8*TS))*8*TS+50;
    const opts=[];
    for(const[d,w]of[[c.dir,6],[(c.dir+1)&3,2],[(c.dir+3)&3,2]]){
      const px=bx+DX[d]*100,py=by+DY[d]*100,tx=Math.floor(px/TS),ty=Math.floor(py/TS);
      if(tx<0||ty<0||tx>=N||ty>=N)continue;
      if(tiles[ty*N+tx]===TR&&(isRL(tx)||isRL(ty)))for(let i=0;i<w;i++)opts.push(d);
    }

  }

function copTarget(c){
  const tx=P.x+(P.car?P.car.vx*.35:0),ty=P.y+(P.car?P.car.vy*.35:0);
  c.losT-=1/60;
  if(c.losT<=0){c.los=hasLOS(c.x,c.y,tx,ty);c.losT=.25}
  if(c.los)return[tx,ty];
  const ci=nearIdx(c.x),cj=nearIdx(c.y),pi=nearIdx(tx),pj=nearIdx(ty);
  const onH=Math.abs(c.y-IC(cj))<60,onV=Math.abs(c.x-IC(ci))<60,wx=pi-ci,wy=pj-cj;
  const sx=Math.sign(wx),sy=Math.sign(wy);
  if(onH&&onV){if(Math.abs(wx)>=Math.abs(wy)&&wx!==0)return[IC(clamp(ci+sx,0,7)),IC(cj)];if(wy!==0)return[IC(ci),IC(clamp(cj+sy,0,7))];return[tx,ty]}
  if(onH){if(wx!==0)return[IC(clamp(ci+sx,0,7)),IC(cj)];return[IC(ci),IC(cj)]}
  if(onV){if(wy!==0)return[IC(ci),IC(clamp(cj+sy,0,7))];return[IC(ci),IC(cj)]}

function copUpdate(c,dt){

    thr=sp>22?-1:0;steer=0;
    if(sp<30&&!c.unloaded){c.unloaded=true;for(let i=0;i<2;i++){const p=mkPed('cop',c.x+Math.cos(c.a+1.57)*(i?-34:34),c.y+Math.sin(c.a+1.57)*(i?-34:34));p.hostile=true}}
  }

      case'free':driveCar(c,dt,0,0,false);c.freeT-=dt;carWalls(c);if(c.freeT<=0||Math.hypot(c.vx,c.vy)<18)resumeAI(c);break;
      case'idle':if(Math.abs(c.vx)+Math.abs(c.vy)>1.5){driveCar(c,dt,0,0,true);carWalls(c)}else{c.vx=c.vy=0}break;
      case'wreck':c.burnT-=dt;if(Math.random()<.6)fireP(c.x+rnd(-10,10),c.y+rnd(-6,6));if(Math.random()<.3)smoke(c.x,c.y,true);break;

  }

    for(const p of tgt){
      const rx=p.x-c.x,ry=p.y-c.y;if(Math.abs(rx)>45||Math.abs(ry)>45)continue;
      const lx=rx*fx+ry*fy,ly=-rx*fy+ry*fx;

        if(p===P){hurt((sp-50)*.14);P.x+=c.vx*.05;P.y+=c.vy*.05;shake=6}

  }

    if(p.ring)p.r+=260*dt;p.vx*=.96;p.vy*=.96;
  }

  for(const s of skids)s.t-=dt;skids=skids.filter(s=>s.t>0);

  for(const k of pickups){
    if(!k.on&&k.on!==undefined&&k.t>0){k.t-=dt;if(k.t<=0)k.on=undefined}

  pickups=pickups.filter(k=>!k.dead);

      if(best)ang=Math.atan2(best.y-P.y,best.x-P.x);

      for(const p of peds)if(p.kind==='civ'&&!p.dead&&Math.hypot(p.x-P.x,p.y-P.y)<300){p.flee=5;p.fa=Math.atan2(p.y-P.y,p.x-P.x)+rnd(-.5,.5)}
    }
  }
  // voiture / giver proches (pour l'UI)
  nearCar=null;if(!P.car){let bd=75;for(const c of cars){if(c.dead||c.mode==='player')continue;const d=Math.hypot(c.x-P.x,c.y-P.y);if(d<bd){bd=d;nearCar=c}}}

function updatePed(p,dt){
  if(p.dead){p.deadT+=dt;return}
  const dp=Math.hypot(P.x-p.x,P.y-p.y);
  let vx=0,vy=0;

    const a=Math.atan2(P.y-p.y,P.x-p.x);p.a=a;

    if(dp>want&&dp<900){vx=Math.cos(a)*62;vy=Math.sin(a)*62;p.walk+=dt*8}
    else if(dp<=want&&dp>80&&Math.random()<.01){p.a+=rnd(-.5,.5)}

      p.shootT=rnd(.7,1.3);const aa=a+rnd(-.16,.16);

      vx=Math.cos(p.a)*p.spd;vy=Math.sin(p.a)*p.spd;p.walk+=dt*p.spd*.1;
    }

    const nx=p.x+vx*dt,ny=p.y+vy*dt,ok=t=>{const tt=tiles[Math.floor(t[1]/TS)*N+Math.floor(t[0]/TS)];
      if(Math.floor(t[0]/TS)<0||Math.floor(t[1]/TS)<0||Math.floor(t[0]/TS)>=N||Math.floor(t[1]/TS)>=N)return false;

function drawBuilding(b,cx,cy,night){
  const k=b.z*.0008,x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.h;
  const C=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]],Rf=C.map(p=>[p[0]+(p[0]-cx)*k,p[1]+(p[1]-cy)*k]);
  const nrm=[[0,-1],[1,0],[0,1],[-1,0]],shade=[.95,.72,.55,.8];
  const nl=Math.min(11,Math.floor(b.z/32));

  const wins=[];
  for(let i=0;i<4;i++){
    const j=(i+1)&3,mx=(C[i][0]+C[j][0])/2,my=(C[i][1]+C[j][1])/2;
    if(nrm[i][0]*(cx-mx)+nrm[i][1]*(cy-my)<=0)continue;
    g.fillStyle=sh(b.col,shade[i]*(.55+.45*(1-night*.5)));
    g.beginPath();g.moveTo(C[i][0],C[i][1]);g.lineTo(C[j][0],C[j][1]);g.lineTo(Rf[j][0],Rf[j][1]);g.lineTo(Rf[i][0],Rf[i][1]);g.closePath();g.fill();

  g.stroke();g.setLineDash([]);

  for(const[i,j]of wins){const t=.93;g.moveTo(lerp(C[i][0],Rf[i][0],t),lerp(C[i][1],Rf[i][1],t));g.lineTo(lerp(C[j][0],Rf[j][0],t),lerp(C[j][1],Rf[j][1],t))}
  g.stroke();

  g.strokeStyle=b.neon;g.lineWidth=2;g.stroke();
  const rcx=lerp(Rf[0][0],Rf[2][0],.5),rcy=lerp(Rf[0][1],Rf[2][1],.5),sz=Math.min(b.w,b.h)*(1+k);

  if(b.hosp){g.fillStyle='#fff';g.fillRect(rcx-sz*.3,rcy-sz*.3,sz*.6,sz*.6);g.fillStyle='#ff2a4a';g.fillRect(rcx-sz*.1,rcy-sz*.26,sz*.2,sz*.52);g.fillRect(rcx-sz*.26,rcy-sz*.1,sz*.52,sz*.2)}

}

function drawMinimap(){
  const mR=Math.min(64*sc,W*.17),x=mR+14,y=mR+14,s=.15;
  g.save();g.beginPath();g.arc(x,y,mR,0,TAU);g.clip();
  g.fillStyle='#14102a';g.fillRect(x-mR,y-mR,2*mR,2*mR);
  g.translate(x,y);g.rotate(rot);g.scale(s,s);g.translate(-cam.x,-cam.y);
  g.drawImage(mm,0,0,WS,WS);
  const blip=(wx,wy,col,r,sq)=>{
    let dx=wx-cam.x,dy=wy-cam.y;const d=Math.hypot(dx,dy),lim=(mR-7)/s;
    if(d>lim){dx*=lim/d;dy*=lim/d}
    g.fillStyle=col;g.beginPath();if(sq)g.rect(cam.x+dx-r/s,cam.y+dy-r/s,2*r/s,2*r/s);else g.arc(cam.x+dx,cam.y+dy,r/s,0,TAU);g.fill();
  };
  blip(HOSP.x,HOSP.y,'#ff2a5a',4.5,true);
  if(!M)for(const v of GIV)if(v.cd<=0)blip(v.x,v.y,'#ffd23f',5);
  if(M)blip(M.x,M.y,'#ffe14d',6.5);
  const f=Math.floor(gameT*5)&1;
  for(const c of cars)if(c.mode==='cop')blip(c.x,c.y,f?'#ff3a3a':'#3a6cff',4);
  for(const p of peds)if(p.kind==='cop'&&!p.dead)blip(p.x,p.y,'#6ab0ff',2.5);
  g.restore();
  g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;g.beginPath();g.arc(x,y,mR,0,TAU);g.stroke();
  g.strokeStyle='#ff3fa4';g.lineWidth=1.5;g.beginPath();g.arc(x,y,mR+3,0,TAU);g.stroke();
  g.save();g.translate(x,y);g.rotate(P.a+rot+Math.PI/2);g.fillStyle='#fff';g.beginPath();g.moveTo(0,-8);g.lineTo(6,7);g.lineTo(0,3);g.lineTo(-6,7);g.closePath();g.fill();g.restore();
  return mR;
}

  let ty=H*.3;
  for(const t of toasts){
    g.globalAlpha=clamp(t.life*3,0,1)*clamp((t.max-t.life)*6,0,1);
    txt(t.t,W/2,ty,clamp(W/20,15,26),'#fff','center',6);ty+=34;g.globalAlpha=1;
  }
  if(helpT>0&&!P.car&&!M&&P.kills===0&&P.money===500){g.globalAlpha=clamp(helpT/2,0,1);txt('Marche jusqu\'à une voiture et appuie sur ENTRER',W/2,H*.18,15,'#fff','center',5);g.globalAlpha=1}
  // vitesse
  if(P.car){
    const sp=Math.hypot(P.car.vx,P.car.vy)*.313,bx=16,by=H-215*sc;
    txt(Math.round(sp)+'',bx,by,clamp(34*sc,28,44),'#fff','left',5);
    txt('KM/H',bx+(sp>=100?66:sp>=10?46:28)*sc,by+8,11,'#ff9ae0','left',3);
    g.fillStyle='rgba(0,0,0,.5)';rr(bx,by+26,90,7,3);g.fillStyle=P.car.boost?'#ffcf3f':'#2ff0ff';rr(bx,by+26,.9*P.car.nitroE,7,3);
    g.fillStyle='rgba(0,0,0,.5)';rr(bx,by+37,90,5,2);g.fillStyle=P.car.hp<35?'#ff3a3a':'#7dffb0';rr(bx,by+37,90*clamp(P.car.hp/P.car.spec.hp,0,1),5,2);
  }
  // contrôles
  if(stick.on){
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;g.fillStyle='rgba(255,255,255,.1)';g.beginPath();g.arc(stick.ox,stick.oy,60*sc,0,TAU);g.fill();g.stroke();
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(stick.x,stick.y,26*sc,0,TAU);g.fill();
  }else{
    g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=2;g.beginPath();g.arc(92*sc,H-110*sc,46*sc,0,TAU);g.stroke();
    txt('◀ ▶',92*sc,H-110*sc,13,'rgba(255,255,255,.3)','center');
  }
  const lab=P.car?'SORTIR':(nearCar?(nearCar.driver?'VOLER':'ENTRER'):'ENTRER');
  btn(btns.act,lab,'#ff3fa4',btns.act.id>=0,!P.car&&!nearCar);
  btn(btns.fire,P.car?'NITRO':'TIR',P.car?'#ffd23f':'#2ff0ff',btns.fire.id>=0,false);
  if(P.car)btn(btns.brake,'FREIN','#7dffb0',btns.brake.id>=0,false);
  if(redFlash>0){g.fillStyle=`rgba(255,20,60,${redFlash*.5})`;g.fillRect(0,0,W,H)}
  if(P.dead){
    const a=clamp((3.4-P.deadT)*1.2,0,.7);g.fillStyle=`rgba(0,0,0,${a})`;g.fillRect(0,0,W,H);
    txt('K.O.',W/2,H*.42,Math.min(W/4,90),'#ff4d6d','center',8);
    txt('Direction l\'hôpital…',W/2,H*.42+60,18,'#fff','center',4);
  }
  // vignette
  const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6);vg.addColorStop(0,'rgba(20,0,40,0)');vg.addColorStop(1,'rgba(20,0,40,.5)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}
const SKY=(function(){const r=mulberry(7),a=[];for(let i=0;i<26;i++)a.push({x:i/26,w:.03+r()*.04,h:.06+r()*.2});return a})();
function drawTitle(){
  const t=performance.now()/1000;
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1a0b3d');gr.addColorStop(.35,'#6a1b9a');gr.addColorStop(.6,'#ff4f8b');gr.addColorStop(.78,'#ffb347');gr.addColorStop(.78,'#2b1055');gr.addColorStop(1,'#12062a');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const hy=H*.78,sr=Math.min(W,H)*.3;
  g.save();g.beginPath();g.rect(0,0,W,hy);g.clip();
  const sg=g.createLinearGradient(0,hy-sr*2,0,hy);sg.addColorStop(0,'#ffe14d');sg.addColorStop(1,'#ff3fa4');
  g.fillStyle=sg;g.beginPath();g.arc(W/2,hy-sr*.55,sr,0,TAU);g.fill();
  g.fillStyle='#ff6a8f';for(let i=0;i<7;i++){g.fillRect(W/2-sr,hy-sr*.55+i*sr*.14+sr*.02,sr*2,i*2.2+1)}
  g.restore();
  g.fillStyle='#1b0a3a';for(const b of SKY){g.fillRect(b.x*W,hy-b.h*H,b.w*W,b.h*H)}
  g.fillStyle='#ffd7a0';for(const b of SKY)for(let k=0;k<6;k++)if(((k*7+Math.floor(b.x*100))&3)===0)g.fillRect(b.x*W+4,hy-b.h*H+8+k*16,3,4);
  // reflets
  for(let i=0;i<10;i++){g.fillStyle=`rgba(255,120,170,${.35-i*.03})`;g.fillRect(W/2-sr*(.9-i*.07),hy+6+i*(H*.2/10),sr*(1.8-i*.14),3)}
  // palmiers
  g.strokeStyle='#0c0420';g.lineCap='round';
  const palm=(x,h,dir)=>{g.lineWidth=6;g.beginPath();g.moveTo(x,H);g.quadraticCurveTo(x+dir*h*.15,H-h*.6,x+dir*h*.3,H-h);g.stroke();g.lineWidth=4;for(let i=0;i<7;i++){const a=i*TAU/7+Math.sin(t+x)*.05;g.beginPath();g.moveTo(x+dir*h*.3,H-h);g.quadraticCurveTo(x+dir*h*.3+Math.cos(a)*h*.22,H-h-h*.12+Math.sin(a)*h*.1,x+dir*h*.3+Math.cos(a)*h*.34,H-h+Math.sin(a)*h*.28);g.stroke()}};
  palm(W*.08,H*.38,1);palm(W*.92,H*.4,-1);g.lineCap='butt';
  const fs=Math.min(W/8.4,86);
  g.font=`900 italic ${fs}px -apple-system,Helvetica,Arial`;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#2ff0ff';g.fillText('NEON COAST',W/2+4,H*.2+4);
  const tg=g.createLinearGradient(0,H*.14,0,H*.26);tg.addColorStop(0,'#fff1a8');tg.addColorStop(.5,'#ff9ae0');tg.addColorStop(1,'#ff3fa4');
  g.lineWidth=7;g.strokeStyle='#1a0b3d';g.strokeText('NEON COAST',W/2,H*.2);g.fillStyle=tg;g.fillText('NEON COAST',W/2,H*.2);
  txt('MONDE OUVERT · NUIT ÉLECTRIQUE',W/2,H*.2+fs*.72,Math.min(W/24,15),'#ffe9f6','center',4);
  g.globalAlpha=.55+.45*Math.sin(t*3);txt('TOUCHE POUR JOUER',W/2,H*.9,Math.min(W/14,22),'#fff','center',5);g.globalAlpha=1;
  txt('Vole des voitures · Fais des missions · Échappe à la police',W/2,H*.9+34,Math.min(W/30,12),'#d9c2ff','center',3);
}
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);
  if(state==='title'){drawTitle();return}
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  g.save();g.translate(W/2+sx,H*.62+sy);g.scale(cam.z,cam.z);g.rotate(rot);g.translate(-cam.x,-cam.y);
  drawWorld();
  g.restore();
  drawHUD();
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(t-last)/1000||.016);last=t;
  if(state==='play')update(dt);
  draw();
}
setupWorld();
requestAnimationFrame(frame);
window.__dbg={P,cars,M:()=>M,start:()=>{state='play'},setState:s=>{state=s}};
</script>
