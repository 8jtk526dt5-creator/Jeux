<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON COAST 3D – Monde ouvert</title>
<style>
html,body{margin:0;height:100%;background:#120a22;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#gl{background:#1a0b3d}
</style>

<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   NEON COAST — jeu de monde ouvert original (vue du dessus, caméra qui
   tourne avec la voiture, bâtiments en pseudo-3D, coucher de soleil néon)
   Canvas 2D pur, zéro dépendance, pensé pour iPhone.
   ===================================================================== */
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=300,H=300,DPR=1;
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261119);
const rr=(x,y,w,h,r)=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()};
const money=n=>'$'+Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* ============================ MONDE ============================ */
const TS=50,N=170,WS=N*TS,I0=6,I1=63;
const TW=0,TSd=1,TR=2,TSW=3,TB=4,TG=5,TP=6,TC=7,TF=8,TGT=9,TFo=10,TCR=11,TCr=12;
const R2=mulberry(777),hsh=(x,y)=>(((Math.imul(x,73856093)^Math.imul(y,19349663))>>>0)%1000)/1000;
const pines=[],treeGrid=new Map();
const inLandT=(tx,ty)=>ty>=64&&tx>=6&&tx<=160&&ty<=160;
const BX0=8,BX1=21,BY0=48,BY1=61;
const inBaseT=(tx,ty)=>tx>=BX0&&tx<=BX1&&ty>=BY0&&ty<=BY1;
const inBaseP=(x,y)=>inBaseT(Math.floor(x/TS),Math.floor(y/TS));
const SHOPS=[],BASEB=[];
const tiles=new Uint8Array(N*N),depth=new Uint8Array(N*N),tileB=new Int16Array(N*N).fill(-1);
const isRL=t=>t>=I0&&t<=I1&&((t-I0)&7)<2;
const IC=k=>(I0+8*k)*TS+50;               // centre d'intersection
const nearIdx=v=>clamp(Math.round((v-IC(0))/400),0,7);
const buildings=[],palms=[],umbrellas=[],fountains=[],parkedSpots=[];
const PAL=[[255,105,180],[40,220,205],[255,170,90],[150,110,255],[245,235,215],[90,170,255],[255,90,110],[120,230,160]];
const NEON=['#ff3fa4','#2ff0ff','#ffd23f','#b86bff','#5dff9b'];
const LOTS=[[1,2],[4,5],[5,0],[2,4],[3,6]];
function blockType(kx,ky){
  if(kx<=1&&ky>=5)return 'base';
  if(kx===6)return 'beach';
  if(LOTS.some(l=>l[0]===kx&&l[1]===ky))return 'lot';
  if((kx===2&&ky===3)||(kx===4&&ky===1)||(kx===1&&ky===6)||(kx===5&&ky===4))return 'park';
  return 'bldg';
}
(function gen(){
  for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
    const i=ty*N+tx;let t;
    if(inBaseT(tx,ty)){
      const per=tx===BX0||tx===BX1||ty===BY0||ty===BY1,gate=per&&(ty===BY0||ty===BY1)&&(tx===14||tx===15);
      t=per?(gate?TGT:TF):TC;
    }else if(tx>=I0&&tx<=I1&&ty>=I0&&ty<=I1){
      if(isRL(tx)||isRL(ty))t=TR;
      else{
        const kx=(tx-8)>>3,ky=(ty-8)>>3,lx=(tx-I0)%8-2,ly=(ty-I0)%8-2;
        const bt=blockType(kx,ky);
        if(lx===0||lx===5||ly===0||ly===5)t=(bt==='beach'&&lx===5)?TSd:TSW;
        else t=bt==='bldg'?TB:bt==='park'?TG:bt==='beach'?TSd:TR;
      }
    }else{
      const dx=Math.max(I0-tx,tx-I1,0),dy=Math.max(I0-ty,ty-I1,0),d=Math.max(dx,dy);
      if(d<=2||(d===3&&R()<.55)){t=TSd;depth[i]=0}else{t=TW;depth[i]=Math.min(9,d+1)}
    }
    if(inLandT(tx,ty)&&!(tx>=I0&&tx<=I1&&ty>=I0&&ty<=I1)){
      let dIn=Math.min(tx-6,160-tx,160-ty);if(tx>63)dIn=Math.min(dIn,ty-64);
      const hz=hsh(tx,ty);depth[i]=0;
      if((ty<=65&&tx<=65)||dIn<=1||(dIn===2&&hz<.5))t=TSd;
      else{
        const lk=((tx-105)/20)**2+((ty-132)/13)**2;
        const vroad=(tx===22||tx===23||tx===38||tx===39||tx===54||tx===55||tx===140||tx===141),hroad=((ty===112||ty===113)&&tx>=22&&tx<=141)||((ty===150||ty===151)&&tx>=22&&tx<=141);
        if(lk<1){t=TW;depth[i]=Math.max(1,Math.min(6,Math.round((1-lk)*9)))}
        else if(lk<1.22)t=TSd;
        else if(vroad||hroad)t=TCR;
        else{
          const inR=(a,b,c,d)=>tx>=a&&tx<=c&&ty>=b&&ty<=d,blot=hsh(tx>>2,ty>>2);
          if((inR(12,70,58,147)||inR(118,70,156,110)||inR(62,116,82,146))&&blot<.84)t=TFo;
          else if(inR(64,70,96,104)&&blot<.9)t=TCr;
          else t=TG;
        }
      }
    }
    tiles[i]=t;
  }
  // bâtiments
  for(let ky=0;ky<7;ky++)for(let kx=0;kx<7;kx++){
    const bt=blockType(kx,ky),tx0=8+kx*8,ty0=8+ky*8;
    if(bt==='bldg'){
      const down=Math.abs(kx-3)<=1&&Math.abs(ky-3)<=1;
      const pat=(kx===0&&ky===0)?0:Math.floor(R()*4);
      let rects=pat===0?[[0,0,4,4]]:pat===1?[[0,0,2,4],[2,0,2,4]]:pat===2?[[0,0,4,2],[0,2,4,2]]:[[0,0,2,2],[2,0,2,2],[0,2,2,2],[2,2,2,2]];
      for(const q of rects){
        const z=down?150+R()*310:70+R()*170;
        const id=buildings.length,col=PAL[Math.floor(R()*PAL.length)];
        const b={x:(tx0+1+q[0])*TS,y:(ty0+1+q[1])*TS,w:q[2]*TS,h:q[3]*TS,z:z,col:col,neon:NEON[Math.floor(R()*NEON.length)],ant:z>300&&R()<.7,hosp:kx===0&&ky===0,kx,ky};
        b.cx=b.x+b.w/2;b.cy=b.y+b.h/2;buildings.push(b);
        for(let yy=0;yy<q[3];yy++)for(let xx=0;xx<q[2];xx++)tileB[(ty0+1+q[1]+yy)*N+tx0+1+q[0]+xx]=id;
      }
    }
    if(bt==='bldg'||bt==='beach'||bt==='park'){
      // palmiers aux coins des trottoirs
      for(const [ax,ay] of [[0,0],[5,0],[0,5],[5,5]])palms.push({x:(tx0+ax+.5)*TS,y:(ty0+ay+.5)*TS,z:70+R()*30,r:R()*6});
    }
    if(bt==='park'){
      for(let i=0;i<7;i++)palms.push({x:(tx0+1.2+R()*3.6)*TS,y:(ty0+1.2+R()*3.6)*TS,z:80+R()*40,r:R()*6});
      fountains.push({x:(tx0+3)*TS,y:(ty0+3)*TS});
    }
    if(bt==='beach'){
      for(let i=0;i<9;i++)palms.push({x:(tx0+1+R()*4)*TS,y:(ty0+1+R()*4)*TS,z:80+R()*40,r:R()*6});
      for(let i=0;i<5;i++)umbrellas.push({x:(tx0+1.3+R()*3.4)*TS,y:(ty0+1.3+R()*3.4)*TS,c:NEON[i%5]});
    }
    if(bt==='lot'){
      for(let col=0;col<4;col++)for(let row=0;row<2;row++)parkedSpots.push({x:(tx0+1.5+col)*TS,y:(ty0+1.2+row*2.4+.3)*TS,lot:kx+','+ky});
    }
  }
  // jetees (prolongent deux avenues vers la mer)
  for(const row of[30,46])for(let rw=0;rw<2;rw++)for(let tx=64;tx<=78;tx++){const i=(row+rw)*N+tx;tiles[i]=TP}
  // batiments de la base militaire
  for(const q of[[10,50,4,3,95,'hangar'],[17,50,4,2,70,'caserne'],[10,57,3,3,105,'hangar'],[17,57,2,2,210,'tour']]){
    const id=buildings.length,b={x:q[0]*TS,y:q[1]*TS,w:q[2]*TS,h:q[3]*TS,z:q[4],H:q[4],col:[98,112,78],neon:'#ff3030',ant:q[5]==='tour',hosp:false,mil:true,kx:-1,ky:-1};
    b.cx=b.x+b.w/2;b.cy=b.y+b.h/2;buildings.push(b);
    for(let yy=0;yy<q[3];yy++)for(let xx=0;xx<q[2];xx++){const i=(q[1]+yy)*N+q[0]+xx;tiles[i]=TB;tileB[i]=id}
  }
  // boutiques : batiments dont la facade sud donne sur le trottoir
  {
    const cand=[];
    for(const b of buildings){
      if(b.mil||b.hosp||b.z>230||b.kx<0)continue;
      if(Math.abs(b.kx-3)<=1&&Math.abs(b.ky-3)<=1)continue;
      if(b.kx===1&&b.ky===2)continue;
      if(b.y+b.h!==(8+b.ky*8+5)*TS)continue;
      cand.push(b);
    }
    for(let i=cand.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
    const types=['24','24','24','24','24','24','gun','gun','burger','burger','burger'],used=[];
    for(const b of cand){
      if(SHOPS.length>=types.length)break;
      if(used.some(u=>Math.hypot(u.cx-b.cx,u.cy-b.cy)<500))continue;
      used.push(b);
      const type=types[SHOPS.length];
      SHOPS.push({x:b.cx,y:b.y+b.h+25,type,b,cd:0,clerk:null,name:type==='24'?'SUPÉRETTE 24/7':type==='gun'?'ARMURERIE':'BURGER SHOT',lock:false});
    }
  }
  // ponton du lac
  for(let tx=83;tx<=89;tx++)for(let rw=0;rw<2;rw++){const i=(132+rw)*N+tx;tiles[i]=TP}
  // arbres de la campagne
  for(let ty=64;ty<=160;ty++)for(let tx=6;tx<=160;tx++){
    const t=tiles[ty*N+tx];let n=0;
    if(t===TFo)n=(R2()<.9?1:0)+(R2()<.5?1:0);else if(t===TG&&ty>=68)n=R2()<.035?1:0;else if(t===TSd&&ty>=67&&tx>=7&&R2()<.04)n=1;
    for(let k=0;k<n;k++){
      const o={x:(tx+.15+R2()*.7)*TS,y:(ty+.15+R2()*.7)*TS,s:.8+R2()*.7,k:Math.floor(R2()*3),oak:t===TG||t===TSd};
      pines.push(o);const key=ty*N+tx;let L=treeGrid.get(key);if(!L){L=[];treeGrid.set(key,L)}L.push(o);
    }
  }
  // palmiers sur le sable ouest/sud
  for(let i=0;i<240;i++){
    const x=R()*5000,y=R()*5000;const tx=Math.floor(x/TS),ty=Math.floor(y/TS);
    if(tiles[ty*N+tx]===TSd&&(tx<I0||ty<I0||tx>I1||ty>I1))palms.push({x,y,z:80+R()*40,r:R()*6});
  }
})();
const HOSP={x:11*TS,y:13.5*TS};
const oob=(tx,ty)=>tx<0||ty<0||tx>=N||ty>=N;
const solidTile=(tx,ty)=>{if(oob(tx,ty))return true;const t=tiles[ty*N+tx];return t===TB||t===TW||t===TF};
const solidBoat=(tx,ty)=>{if(oob(tx,ty))return true;return tiles[ty*N+tx]!==TW};
const solidFoot=(tx,ty)=>{if(oob(tx,ty))return true;const t=tiles[ty*N+tx];return t===TB||t===TF};
let curAlt=0;
const solidHeli=(tx,ty)=>{if(oob(tx,ty))return true;const i=ty*N+tx;if(tiles[i]!==TB)return false;const b=buildings[tileB[i]];return !b||b.H>curAlt-12};
const solidPx=(x,y)=>solidTile(Math.floor(x/TS),Math.floor(y/TS));
const blockPx=(x,y)=>{const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(oob(tx,ty))return true;const t=tiles[ty*N+tx];return t===TB||t===TF};
function pushOut(o,r,mode){
  let hn=null;const sf=mode===1?solidBoat:mode===2?solidFoot:mode===3?solidHeli:solidTile;
  const x0=Math.floor((o.x-r)/TS),x1=Math.floor((o.x+r)/TS),y0=Math.floor((o.y-r)/TS),y1=Math.floor((o.y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(!sf(tx,ty))continue;
    const cx=clamp(o.x,tx*TS,tx*TS+TS),cy=clamp(o.y,ty*TS,ty*TS+TS);
    let dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
    if(d2<r*r){
      let d=Math.sqrt(d2);
      if(d<.001){dx=o.x-(tx*TS+25);dy=o.y-(ty*TS+25);d=Math.hypot(dx,dy)||1;}
      const nx=dx/d,ny=dy/d,push=(d2<.001?r+TS/2:r-d);
      o.x+=nx*push;o.y+=ny*push;hn={x:nx,y:ny};
    }
  }
  if(mode!==1&&mode!==3&&treeGrid.size){
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const L=treeGrid.get(ty*N+tx);if(!L)continue;
      for(const t of L){const dx=o.x-t.x,dy=o.y-t.y,rr=r+3.4,d2=dx*dx+dy*dy;if(d2<rr*rr){const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d;o.x+=nx*(rr-d);o.y+=ny*(rr-d);hn={x:nx,y:ny}}}
    }
  }
  return hn;
}
function hasLOS(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/24);
  for(let i=1;i<n;i++){const t=i/n;if(blockPx(lerp(x0,x1,t),lerp(y0,y1,t)))return false}
  return true;
}
const inInter=(x,y)=>isRL(Math.floor(x/TS))&&isRL(Math.floor(y/TS));
const DX=[1,0,-1,0],DY=[0,1,0,-1];
function randRoadPoint(){
  const horiz=Math.random()<.5,k=ri(0,7),pos=rnd(I0*TS+120,(I1+1)*TS-120),band=(I0+8*k)*TS;
  if(horiz){const e=Math.random()<.5;return{x:pos,y:band+(e?75:25),dir:e?0:2}}
  const s=Math.random()<.5;return{x:band+(s?25:75),y:pos,dir:s?1:3};
}
function districtName(x,y){
  if(inBaseP(x,y))return 'BASE MILITAIRE';
  {const tx=Math.floor(x/TS),ty=Math.floor(y/TS);
   if(inLandT(tx,ty)&&ty>=67&&!oob(tx,ty)){const t=tiles[ty*N+tx];return t===TW?'LAC DE CRISTAL':t===TFo?'FORÊT ÉMERAUDE':t===TCr?'CHAMPS DORÉS':t===TCR?'ROUTE DU SUD':t===TP?'PONTON DU LAC':'PRAIRIES DU SUD'}}
  {const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(!oob(tx,ty)&&tiles[ty*N+tx]===TW)return 'OCÉAN';if(!oob(tx,ty)&&tiles[ty*N+tx]===TP)return 'LA MARINA'}
  const kx=((x/TS-8)/8)|0,ky=((y/TS-8)/8)|0;
  if(x>(I1-6)*TS)return 'PLAGE DU COUCHANT';
  if(x<I0*TS||y<I0*TS||x>(I1+1)*TS||y>(I1+1)*TS)return 'CÔTE OUEST';
  if(Math.abs(kx-3)<=1&&Math.abs(ky-3)<=1)return 'CENTRE AQUA';
  if(ky<=1)return 'QUARTIER NÉON';
  if(kx<=1)return 'MARINA FLAMINGO';
  return 'LITTLE PALMA';
}
// mini-carte pré-rendue
const mm=document.createElement('canvas');mm.width=mm.height=N*6;
(function(){
  const m=mm.getContext('2d'),s=6;
  const col=[ '#1d7fb0','#d8c18c','#6a6488','#4d4568','#b4509b','#2a9a68','#8b6b3d','#6f7a5e','#333','#6f7a5e','#1f6b45','#5a5470','#b59a3c' ];
  for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
    const t=tiles[ty*N+tx];m.fillStyle=col[t];
    if(t===TW)m.fillStyle=depth[ty*N+tx]>5?'#145f8a':'#1d7fb0';
    m.fillRect(tx*s,ty*s,s+.5,s+.5);
  }
})();

/* ============================ AUDIO ============================ */
let AC=null,master,musicG,sfxG,engOsc,engG,engF,sirOsc,sirG,noiseBuf,muted=false,nextT=0,stepI=0;
const BPM=102,STEP=60/BPM/4,ROOTS=[45,41,48,43],TRI=[[0,3,7],[0,4,7],[0,4,7],[0,4,7]];
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
    musicG=AC.createGain();musicG.gain.value=.55;musicG.connect(master);
    sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
    const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    engOsc=AC.createOscillator();engOsc.type='sawtooth';engF=AC.createBiquadFilter();engF.type='lowpass';engF.frequency.value=420;
    engG=AC.createGain();engG.gain.value=0;engOsc.connect(engF);engF.connect(engG);engG.connect(sfxG);engOsc.start();
    sirOsc=AC.createOscillator();sirOsc.type='square';sirG=AC.createGain();sirG.gain.value=0;sirOsc.connect(sirG);sirG.connect(sfxG);sirOsc.start();
    nextT=AC.currentTime+.1;
    setInterval(musicTick,80);
  }catch(e){AC=null}
}
function note(t,f,dur,type,vol,cut,dest){
  const o=AC.createOscillator(),gn=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(cut,t);fl.frequency.exponentialRampToValueAtTime(Math.max(150,cut*.25),t+dur);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.012);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(fl);fl.connect(gn);gn.connect(dest||musicG);o.start(t);o.stop(t+dur+.05);
}
function noiseHit(t,dur,vol,type,freq,dest){
  const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=freq;
  const gn=AC.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(gn);gn.connect(dest||sfxG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
}
function kick(t){
  const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  gn.gain.setValueAtTime(.8,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(gn);gn.connect(musicG);o.start(t);o.stop(t+.3);
}
function musicTick(){
  if(!AC)return;
  if(muted||state!=='play'){nextT=AC.currentTime+.1;return}
  while(nextT<AC.currentTime+.3){
    const s=stepI&63,bar=(s>>4)&3,st=s&15,root=ROOTS[bar],t=nextT;
    if(st%4===0)kick(t);
    if(st===4||st===12)noiseHit(t,.16,.22,'highpass',1800,musicG);
    if(st%2===1)noiseHit(t,.04,.07,'highpass',7000,musicG);
    if(st%2===0)note(t,mf(root),STEP*1.8,'sawtooth',.2,800,musicG);
    const iv=TRI[bar],ai=[0,1,2,1,2,1,0,1][st&7]+(st>7?1:0);
    note(t,mf(root+24+iv[ai%3]+(ai>2?12:0)),STEP*.9,'square',.045,2600,musicG);
    if(st===0)for(const v of iv)note(t,mf(root+12+v),STEP*15,'triangle',.05,900,musicG);
    nextT+=STEP;stepI++;
  }
}
function sfxShot(){if(!AC||muted)return;const t=AC.currentTime;noiseHit(t,.13,.5,'lowpass',2600);note(t,180,.1,'square',.12,1500,sfxG)}
function sfxBoom(){if(!AC||muted)return;const t=AC.currentTime;noiseHit(t,.9,.9,'lowpass',500)}
function sfxCrash(v){if(!AC||muted)return;noiseHit(AC.currentTime,.2,clamp(v/400,.1,.6),'lowpass',1400)}

function driveCar(c,dt,thr,steer,hb){
  const s=c.spec,top=s.top*(c.boost?1.35:1),acc=s.acc*(c.boost?2.2:1);
  let fx=Math.cos(c.a),fy=Math.sin(c.a),vf=c.vx*fx+c.vy*fy;
  const sgn=(s.heli||vf>=0)?1:-1,k=s.heli?1:Math.min(1,Math.abs(vf)/(s.boat?50:90)),rate=(s.turn||2.7)*(1-.5*Math.min(1,Math.abs(vf)/top));
  c.a+=steer*rate*k*sgn*dt*(hb?1.45:1);
  fx=Math.cos(c.a);fy=Math.sin(c.a);
  vf=c.vx*fx+c.vy*fy;let vs=-c.vx*fy+c.vy*fx;
  if(thr>.02){vf+=thr*acc*Math.max(0,1-Math.max(0,vf)/top)*dt*1.15;if(vf<0)vf+=thr*acc*1.5*dt}
  else if(thr<-.02){if(vf>12)vf+=thr*acc*1.7*dt;else vf+=thr*acc*.6*dt*Math.max(0,1-(-vf)/(top*.35))}
  else{const d=(s.fr||140)*dt;vf=Math.abs(vf)<d?0:vf-Math.sign(vf)*d}
  vf*=Math.exp(-.12*dt);vs*=Math.exp(-(hb?1.4:(s.grip||8)*((s.boat||s.heli)?1:(1-.35*RAIN)))*dt);if(hb)vf*=Math.exp(-.9*dt);
  c.vx=fx*vf-fy*vs;c.vy=fy*vf+fx*vs;c.x+=c.vx*dt;c.y+=c.vy*dt;c.slip=Math.abs(vs);
  const sp=Math.hypot(c.vx,c.vy);
  if(!s.boat&&!s.heli&&(c.slip>70||(hb&&sp>110))&&skids.length<500&&Math.random()<.7){
    for(const sd of[-1,1]){const px=c.x-fx*c.spec.l*.3-fy*sd*c.spec.w*.4,py=c.y-fy*c.spec.l*.3+fx*sd*c.spec.w*.4;skids.push({x:px,y:py,t:10})}
  }
}
function carWalls(c){
  const s=c.spec,fx=Math.cos(c.a),fy=Math.sin(c.a);let worst=0;
  for(const off of[-s.l*.3,0,s.l*.3]){

  if(c.los)return[tx,ty];
  const ci=nearIdx(c.x),cj=nearIdx(c.y),pi=nearIdx(tx),pj=nearIdx(ty);
  const onH=Math.abs(c.y-IC(cj))<60,onV=Math.abs(c.x-IC(ci))<60,wx=pi-ci,wy=pj-cj;
  const sx=Math.sign(wx),sy=Math.sign(wy);

  if(onH){if(wx!==0)return[IC(clamp(ci+sx,0,7)),IC(cj)];return[IC(ci),IC(cj)]}
  if(onV){if(wy!==0)return[IC(ci),IC(clamp(cj+sy,0,7))];return[IC(ci),IC(cj)]}

function copUpdate(c,dt){

  if(L&&!Rr)desired=c.a+.9;else if(Rr&&!L)desired=c.a-.9;else if(A||(L&&Rr)){c.av=c.av||(Math.random()<.5?1:-1);desired=c.a+c.av*1.2}else c.av=0;
  const err=angDiff(c.a,desired);

  }

  if(c.revT>0){c.revT-=dt;thr=-1;steer=-(steer||1)}

}

function update(dt){
  gameT+=dt;hour=(hour+dt/75)%24;weatherTick(dt);faunaUpdate(dt);
  shake*=Math.exp(-6*dt);redFlash=Math.max(0,redFlash-dt);helpT-=dt;
  updatePlayer(dt);
  for(const c of cars){
    switch(c.mode){
      case'ai':aiUpdate(c,dt);break;
      case'cop':copUpdate(c,dt);carWalls(c);break;
      case'free':driveCar(c,dt,0,0,false);c.freeT-=dt;carWalls(c);if(c.freeT<=0||Math.hypot(c.vx,c.vy)<18)resumeAI(c);break;
      case'idle':if(Math.abs(c.vx)+Math.abs(c.vy)>1.5){driveCar(c,dt,0,0,true);carWalls(c)}else{c.vx=c.vy=0}break;
      case'air':airUpdate(c,dt);break;
      case'wreck':if(c.spec.heli)c.alt=Math.max(0,c.alt-140*dt);c.burnT-=dt;if(Math.random()<.6)fireP(c.x+rnd(-10,10),c.y+rnd(-6,6));if(Math.random()<.3)smoke(c.x,c.y,true);break;
    }
    if(c.spec.boat&&!c.dead){const bs=Math.hypot(c.vx,c.vy);if(bs>30){c.foamT-=dt;if(c.foamT<=0){c.foamT=.06;parts.push({x:c.x-Math.cos(c.a)*c.spec.l*.5,y:c.y-Math.sin(c.a)*c.spec.l*.5,vx:0,vy:0,life:1.2,max:1.2,r:4+bs*.03,foam:true})}}}
    if(!c.dead&&c.hp<c.spec.hp*.35&&Math.random()<dt*(c.hp<c.spec.hp*.15?14:6)){c.hp<c.spec.hp*.15?fireP(c.x+Math.cos(c.a)*c.spec.l*.35,c.y+Math.sin(c.a)*c.spec.l*.35):smoke(c.x+Math.cos(c.a)*c.spec.l*.35,c.y+Math.sin(c.a)*c.spec.l*.35,false);if(c.hp<c.spec.hp*.15)c.hp-=dt*3,c.hp<=0&&wreck(c)}
  }
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++)carCar(cars[i],cars[j]);
  // voitures vs piétons
  for(const c of cars){
    if(c.dead||(c.spec.heli&&c.alt>12)||c.spec.boat)continue;const sp=Math.hypot(c.vx,c.vy);if(sp<70)continue;
    const fx=Math.cos(c.a),fy=Math.sin(c.a);
    const tgt=[];for(const p of peds)if(!p.dead)tgt.push(p);if(!P.car&&!P.dead)tgt.push(P);
    for(const p of tgt){
      const rx=p.x-c.x,ry=p.y-c.y;if(Math.abs(rx)>45||Math.abs(ry)>45)continue;
      const lx=rx*fx+ry*fy,ly=-rx*fy+ry*fx;
      if(Math.abs(lx)<c.spec.l/2+5&&Math.abs(ly)<c.spec.w/2+5){
        if(p===P){hurt((sp-50)*.14);P.x+=c.vx*.05;P.y+=c.vy*.05;shake=6}
        else{killPed(p,c===P.car);spark(p.x,p.y,5);sfxCrash(200)}
      }
    }
  }
  for(const p of peds)updatePed(p,dt);
  updateBullets(dt);
  for(const p of parts){
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.grow)p.r=Math.max(.5,p.r+p.grow*dt);
    if(p.ring)p.r+=260*dt;p.vx*=.96;p.vy*=.96;
  }
  parts=parts.filter(p=>p.life>0);
  for(const s of skids)s.t-=dt;skids=skids.filter(s=>s.t>0);
  // ramassages
  for(const k of pickups){
    if(!k.on&&k.on!==undefined&&k.t>0){k.t-=dt;if(k.t<=0)k.on=undefined}
    if(k.on===false)continue;
    if(Math.hypot(P.x-k.x,P.y-k.y)<26&&!P.dead){
      if(k.kind==='cash'){P.money+=k.val;sfxCash()}
      else if(k.kind==='armor'){if(P.armor>=100)continue;P.armor=Math.min(100,P.armor+k.val);sfxCash();toast('GILET PARE-BALLES +50',1400)}
      else if(k.kind==='wpn'){P.weapons[4]=true;P.ammo[4]+=4;toast('LANCE-ROQUETTES récupéré',2000);sfxCash()}
      else{if(P.hp>=100)continue;P.hp=Math.min(100,P.hp+k.val);sfxCash()}
      k.on=false;k.t=45;k.dead=!k.home;
    }
  }
  for(const k of pickups)if(k.on===false&&!k.dead){k.t-=dt;if(k.t<=0)k.on=undefined}
  pickups=pickups.filter(k=>!k.dead);
  manage(dt);copManager(dt);updateMission(dt);updateShops(dt);
  // texte lieu
  const dn=districtName(P.x,P.y);if(dn!==lastDistrict){lastDistrict=dn;districtT=3.2}districtT-=dt;
  for(const t of toasts)t.life-=dt;toasts=toasts.filter(t=>t.life>0);
  // caméra
  const sp=P.car?Math.hypot(P.car.vx,P.car.vy):0;
  const ht=(P.car?P.car.a:P.a)+cam.off;
  cam.head+=angDiff(cam.head,ht)*Math.min(1,dt*(camDrag?18:(P.car?3.2:5)));
  cam.idle=camDrag?0:cam.idle+dt;
  {const mv=P.car?Math.hypot(P.car.vx,P.car.vy):Math.hypot(P.vx,P.vy);if(!camDrag&&cam.idle>2.4&&mv>25){const d=Math.exp(-dt*1.5);cam.off*=d;cam.pit*=d}}
  const lx=P.car?P.car.vx*.12:0,ly=P.car?P.car.vy*.12:0;
  cam.x=lerp(cam.x,P.x+lx,Math.min(1,dt*9));cam.y=lerp(cam.y,P.y+ly,Math.min(1,dt*9));
  const zt=Math.min(W,H)/560*(P.car?1-.3*clamp(sp/450,0,1):1.3);
  cam.z=lerp(cam.z,zt,Math.min(1,dt*2.5));
  rot=-cam.head-Math.PI/2;
  audioUpdate();
}

function doPunchHit(){

const PROPS=[],PGRID=new Map();let jumpEdge=false,covEdge=false;
function addProp(kind,x,y,hw,hd,h){

  for(let ty=Math.floor((y-hd)/TS);ty<=Math.floor((y+hd)/TS);ty++)for(let tx=Math.floor((x-hw)/TS);tx<=Math.floor((x+hw)/TS);tx++){
    const k=ty*N+tx;let L=PGRID.get(k);if(!L){L=[];PGRID.set(k,L)}L.push(p)}
}
function genProps(){

  const mk=(tx,ty,h1,h2)=>{
    const long=hsh(tx+17,ty+4)>.5,jx=(hsh(tx,ty+9)-.5)*12,jy=(hsh(tx+9,ty)-.5)*12,cx=(tx+.5)*TS+jx,cy=(ty+.5)*TS+jy;
    if(nearShop(cx,cy))return;
    const K=['dump','crate','barrier','sandbag','wall','planter','crate2'][Math.min(6,Math.floor(h2*7))];
    let hw,hd,h;
    if(K==='dump'){hw=13;hd=7;h=18}else if(K==='crate'){hw=7;hd=7;h=13}else if(K==='crate2'){hw=7.5;hd=7.5;h=26}

  for(let ty=I0;ty<=I1;ty++)for(let tx=I0;tx<=I1;tx++){
    if(tiles[ty*N+tx]!==TSd)continue;const h1=hsh(tx*3+1,ty*5+2);if(h1>.22)continue;mk(tx,ty,h1,hsh(tx+50,ty+70));

function pushOutProps(o,r,z){
  const tx=Math.floor(o.x/TS),ty=Math.floor(o.y/TS);let hn=null;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const L=PGRID.get((ty+j)*N+tx+i);if(!L)continue;
    for(const p of L){if(z>p.h-2)continue;
      const cx=clamp(o.x,p.x-p.hw,p.x+p.hw),cy=clamp(o.y,p.y-p.hd,p.y+p.hd),dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;

        else{const d=Math.sqrt(d2),pu=r-d;o.x+=dx/d*pu;o.y+=dy/d*pu;hn={x:dx/d,y:dy/d}}
      }}}

function propCar(c){

function nearestCover(x,y){
  let best=null;const consider=(px,py,d)=>{if(!best||d<best.d)best={d,px,py}};
  const tx=Math.floor(x/TS),ty=Math.floor(y/TS);
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
    const X=tx+i,Y=ty+j;
    if(!oob(X,Y)&&solidFoot(X,Y)){const cx=clamp(x,X*TS,X*TS+TS),cy=clamp(y,Y*TS,Y*TS+TS);consider(cx,cy,Math.hypot(x-cx,y-cy))}
    const L=PGRID.get(Y*N+X);if(L)for(const p of L){const cx=clamp(x,p.x-p.hw,p.x+p.hw),cy=clamp(y,p.y-p.hd,p.y+p.hd);consider(cx,cy,Math.hypot(x-cx,y-cy))}
  }
  for(const c of cars){
    if(c===P.car||c.spec.heli)continue;if(Math.abs(c.x-x)>90||Math.abs(c.y-y)>90)continue;
    const ca=Math.cos(c.a),sa=Math.sin(c.a),rx=x-c.x,ry=y-c.y,lx=rx*ca+ry*sa,lz=-rx*sa+ry*ca,hl=c.spec.l/2,hw=c.spec.w/2,cl=clamp(lx,-hl,hl),cz=clamp(lz,-hw,hw);

  }
  if(!best)return null;const nx=x-best.px,ny=y-best.py,d=Math.hypot(nx,ny);if(d<.001)return null;best.nx=nx/d;best.ny=ny/d;return best;
}
