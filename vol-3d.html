<body>
<canvas id="c"></canvas>
<div id="ui">

<script>
// ═══════════════════════════════════════════════════════
// MOTEUR 3D — CANVAS 2D + PROJECTION PERSPECTIVE MANUELLE
// Compatible partout : Safari iOS, navigateur in-app, etc.
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY, FOCAL;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W/2; CY = H/2;
  FOCAL = Math.min(W, H) * 0.9;
}
resize();
window.addEventListener('resize', resize);

// ── Matrices 4×4 (Float32Array) ──────────────────────
function m4(){ return new Float32Array(16); }
function identity(){
  const m=m4(); m[0]=m[5]=m[10]=m[15]=1; return m;
}
function mulM(a,b){
  const o=m4();
  for(let c=0;c<4;c++) for(let r=0;r<4;r++){
    let s=0; for(let k=0;k<4;k++) s+=a[r+k*4]*b[k+c*4]; o[r+c*4]=s;
  } return o;
}
function translate(tx,ty,tz){
  const m=identity(); m[12]=tx;m[13]=ty;m[14]=tz; return m;
}
function scaleM(sx,sy,sz){
  const m=identity(); m[0]=sx;m[5]=sy;m[10]=sz; return m;
}
function rotX(a){ const m=identity(),c=Math.cos(a),s=Math.sin(a); m[5]=c;m[6]=s;m[9]=-s;m[10]=c; return m; }
function rotY(a){ const m=identity(),c=Math.cos(a),s=Math.sin(a); m[0]=c;m[2]=-s;m[8]=s;m[10]=c; return m; }
function rotZ(a){ const m=identity(),c=Math.cos(a),s=Math.sin(a); m[0]=c;m[1]=s;m[4]=-s;m[5]=c; return m; }

function applyM(m,[x,y,z]){
  const w=m[3]*x+m[7]*y+m[11]*z+m[15];
  return [
    (m[0]*x+m[4]*y+m[8]*z+m[12])/w,
    (m[1]*x+m[5]*y+m[9]*z+m[13])/w,
    (m[2]*x+m[6]*y+m[10]*z+m[14])/w
  ];
}

// Vue : caméra -> espace caméra
// Convention simple : Z positif = devant la caméra
function buildView(ex,ey,ez,cx,cy,cz){
  // forward = normalize(target - eye)
  let fx=cx-ex, fy=cy-ey, fz=cz-ez;
  const fl=Math.sqrt(fx*fx+fy*fy+fz*fz)||1; fx/=fl; fy/=fl; fz/=fl;
  // right = cross(worldUp=(0,1,0), forward) → puis normaliser
  // cross((0,1,0), f) = (1*fz-0*fy, 0*fx-0*fz, 0*fy-1*fx) = (fz, 0, -fx)
  let rx=fz, ry=0, rz=-fx;
  const rl=Math.sqrt(rx*rx+rz*rz)||1; rx/=rl; rz/=rl;
  // up = cross(forward, right)  [pour garder le trièdre direct]
  const ux=fy*rz-fz*ry, uy=fz*rx-fx*rz, uz=fx*ry-fy*rx;
  // Matrice de vue : chaque ligne = un axe de la base caméra
  // m[col*4+row] stockage colonne-majeure
  // row0=right, row1=up, row2=forward  → Z positif devant
  const m=m4();
  m[0]=rx;  m[4]=ry;  m[8]=rz;  m[12]=-(rx*ex+ry*ey+rz*ez);
  m[1]=ux;  m[5]=uy;  m[9]=uz;  m[13]=-(ux*ex+uy*ey+uz*ez);
  m[2]=fx;  m[6]=fy;  m[10]=fz; m[14]=-(fx*ex+fy*ey+fz*ez);
  m[15]=1;
  return m;
}

// Projection perspective : espace caméra → écran
// Z positif = devant. Y positif = haut monde = haut écran (donc CY - ...)
function project([x,y,z]){
  if(z<=0.1) return null;
  return [CX + x/z*FOCAL, CY - y/z*FOCAL, z];
}

// ── Rendu : polygone plein (face 3D) ─────────────────
function drawFace(pts2d, fillColor, strokeColor){
  if(pts2d.some(p=>!p)) return;
  ctx.beginPath();
  ctx.moveTo(pts2d[0][0], pts2d[0][1]);
  for(let i=1;i<pts2d.length;i++) ctx.lineTo(pts2d[i][0], pts2d[i][1]);
  ctx.closePath();
  if(fillColor){ ctx.fillStyle=fillColor; ctx.fill(); }
  if(strokeColor){ ctx.strokeStyle=strokeColor; ctx.lineWidth=0.8; ctx.stroke(); }
}

// Éclairage simple : dot produit avec direction solaire
const SUN = (()=>{ const v=[0.6,0.7,0.4]; const l=Math.sqrt(v[0]**2+v[1]**2+v[2]**2); return v.map(x=>x/l); })();

function lightColor(nx,ny,nz, baseH,baseS,baseL){
  const dot=Math.max(0, nx*SUN[0]+ny*SUN[1]+nz*SUN[2]);
  const l=Math.round(baseL*0.45 + baseL*0.55*dot);
  return `hsl(${baseH},${baseS}%,${l}%)`;
}

// Transforme les sommets 3D locaux par la matrice modèle+vue puis projette
let VIEW = identity();
function transformPts(pts, modelM){
  return pts.map(p => {
    const w = applyM(modelM, p);
    const v = applyM(VIEW, w);
    return project(v);
  });
}

// ── Primitives 3D ────────────────────────────────────
// Boîte : dessine les faces visibles
function drawBox(modelM, w,h,d, hue,sat,baseLt, alpha=1){
  const hw=w/2,hh=h/2,hd=d/2;
  const v=[
    [-hw,-hh,-hd],[ hw,-hh,-hd],[ hw, hh,-hd],[-hw, hh,-hd],
    [-hw,-hh, hd],[ hw,-hh, hd],[ hw, hh, hd],[-hw, hh, hd]
  ];
  const faces=[
    {i:[0,1,2,3],n:[0,0,-1]},{i:[5,4,7,6],n:[0,0,1]},
    {i:[1,5,6,2],n:[1,0,0]},{i:[4,0,3,7],n:[-1,0,0]},
    {i:[3,2,6,7],n:[0,1,0]},{i:[4,5,1,0],n:[0,-1,0]}
  ];
  // Projeter tous les sommets
  const vw = v.map(p=>applyM(modelM,p));
  const vv = vw.map(p=>applyM(VIEW,p));
  const vs = vv.map(p=>project(p));

  // Trier les faces par profondeur (painter's algo simple)
  const toRender=[];
  faces.forEach(f=>{
    const pts=f.i.map(i=>vs[i]);
    if(pts.some(p=>!p)) return;
    // Back-face culling en espace vue
    const a=vv[f.i[0]], b=vv[f.i[1]], c=vv[f.i[2]];
    const ax=b[0]-a[0],ay=b[1]-a[1],az=b[2]-a[2];
    const bx=c[0]-a[0],by=c[1]-a[1],bz=c[2]-a[2];
    const nz=ax*by-ay*bx;
    if(nz>=0) return; // face cachée
    const depth=(pts[0][2]+pts[1][2]+pts[2][2]+pts[3][2])/4;
    toRender.push({pts, depth, n:f.n});
  });
  toRender.sort((a,b)=>b.depth-a.depth);
  toRender.forEach(f=>{
    const col=lightColor(f.n[0],f.n[1],f.n[2], hue,sat,baseLt);
    ctx.globalAlpha=alpha;
    drawFace(f.pts, col, `hsl(${hue},${sat}%,${Math.round(baseLt*0.6)}%)`);
    ctx.globalAlpha=1;
  });
}

// Cylindre bas-poly (12 faces latérales)
function drawCylinder(modelM, r,h,segs, hue,sat,lt){
  const hs=h/2;
  const faces=[];
  for(let i=0;i<segs;i++){
    const a0=i/segs*Math.PI*2, a1=(i+1)/segs*Math.PI*2;
    const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    const p0=applyM(VIEW,applyM(modelM,[c0*r,-hs,s0*r]));
    const p1=applyM(VIEW,applyM(modelM,[c0*r, hs,s0*r]));
    const p2=applyM(VIEW,applyM(modelM,[c1*r, hs,s1*r]));
    const p3=applyM(VIEW,applyM(modelM,[c1*r,-hs,s1*r]));
    const depth=(p0[2]+p1[2]+p2[2]+p3[2])/4;
    const nx=(c0+c1)/2, nz=(s0+s1)/2;
    faces.push({pts:[project(p0),project(p1),project(p2),project(p3)], depth, nx, nz});
  }
  faces.sort((a,b)=>b.depth-a.depth);
  faces.forEach(f=>{
    if(f.pts.some(p=>!p))return;
    const col=lightColor(f.nx,0,f.nz, hue,sat,lt);
    drawFace(f.pts, col, null);
  });
}

// Cône bas-poly
function drawCone(modelM, r,h,segs, hue,sat,lt){
  const faces=[];
  for(let i=0;i<segs;i++){
    const a0=i/segs*Math.PI*2, a1=(i+1)/segs*Math.PI*2;
    const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    const tip=applyM(VIEW,applyM(modelM,[0,h,0]));
    const b0 =applyM(VIEW,applyM(modelM,[c0*r,0,s0*r]));
    const b1 =applyM(VIEW,applyM(modelM,[c1*r,0,s1*r]));
    const depth=(tip[2]+b0[2]+b1[2])/3;
    const nx=(c0+c1)/2, nz=(s0+s1)/2;
    faces.push({pts:[project(tip),project(b0),project(b1)], depth, nx, nz});
  }
  faces.sort((a,b)=>b.depth-a.depth);
  faces.forEach(f=>{
    if(f.pts.some(p=>!p))return;
    const col=lightColor(f.nx,0.3,f.nz, hue,sat,lt);
    drawFace(f.pts, col, null);
  });
}

// Plan horizontal (sol, piste)
function drawPlane(modelM, w,d, color){
  const hw=w/2,hd=d/2;
  const corners=[[-hw,0,-hd],[hw,0,-hd],[hw,0,hd],[-hw,0,hd]];
  const pts=corners.map(p=>project(applyM(VIEW,applyM(modelM,p))));
  if(pts.some(p=>!p)) return;
  drawFace(pts, color, null);
}

// ═══════════════════════════════════════════════════════
// SCÈNE ET MONDE
// ═══════════════════════════════════════════════════════
// Seed aléatoire déterministe
function sr(n){ return ((Math.sin(n*127.1)*43758.5453)%1+1)%1; }

// Arbres
const TREES=[];
for(let i=0;i<80;i++) TREES.push({x:(sr(i*3)-.5)*700,z:(sr(i*3+1)-.5)*700,s:.6+sr(i*3+2)*.8});

// Nuages
const CLOUDS=[];
for(let i=0;i<20;i++) CLOUDS.push({
  x:(sr(i*5)-.5)*600, y:55+sr(i*5+1)*70, z:(sr(i*5+2)-.5)*600,
  rx:sr(i*5+3)*.5, puffs:Array.from({length:4+Math.floor(sr(i*5+4)*3)},(_,j)=>({
    dx:(sr(i*20+j*4)-.5)*10, dy:(sr(i*20+j*4+1)-.5)*2, dz:(sr(i*20+j*4+2)-.5)*6,
    r:3+sr(i*20+j*4+3)*2
  }))
});

// Tuiles de sol
const TILE=200, TG=5;
const TILES=[];
for(let i=0;i<TG;i++) for(let j=0;j<TG;j++)
  TILES.push({x:(i-2)*TILE, z:(j-2)*TILE, h:Math.round(45+sr(i*5+j)*15)});

// Piste
const RWX=250,RWZ=30,RWLEN=90,RWWID=14,RWHDG=0;
const rwCos=Math.cos(RWHDG),rwSin=Math.sin(RWHDG);

// ═══════════════════════════════════════════════════════
// VOL
// ═══════════════════════════════════════════════════════
let px=0,py=40,pz=0, pitch=0,roll=0,yaw=0,speed=28;
const MIN_SPD=14,MAX_SPD=55;
let vertSpd=0,prevPY=40;
let camX=0,camY=44,camZ=-12,lkX=0,lkY=40,lkZ=0;
let propAngle=0;
let gameRunning=true,totalDist=0,crashed=false,lastT=performance.now();

// Atterrissage
const LV=6,LP=14,LA=20,LL=7,APPR=380;
let inApproach=false,landDone=false,beepT=0;

// Messages
const CMsgs={
  hors:["Presque — mais la piste était un peu plus loin !","Tu avais de l'élan, vise le tarmac.","Le sol n'était pas la bonne piste. On réessaie ?"],
  vit:["Belle approche, mais un peu brusque !","Descends plus doucement en finale.","Presque ! Moins de vitesse verticale."],
  pitch:["L'angle était trop fort. Nez légèrement relevé.","Trop piqué en finale. Redresse avant de toucher.","L'assiette était trop prononcée."],
  align:["Aligne-toi avec l'axe de la piste.","Un peu de dérive en finale.","Beau vol ! Juste l'alignement."],
  sol:["Le sol n'était pas prévu là !","Un peu tôt pour atterrir ici.","Ce n'était pas la piste, mais bravo !"]
};
const OKMsgs=["Posé comme une plume. Magnifique.","Atterrissage de capitaine !","Les passagers n'ont rien senti.","Douceur et précision.","Parfaitement centré sur la piste."];
const rnd=a=>a[Math.floor(Math.random()*a.length)];

// ═══════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════
let actx,masterG,muted=false,audioOn=false;
function initAudio(){
  if(audioOn)return; audioOn=true;
  actx=new(window.AudioContext||window.webkitAudioContext)();
  masterG=actx.createGain(); masterG.gain.value=0.15; masterG.connect(actx.destination);
  [220,261.6,329.6,392].forEach((f,i)=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,actx.currentTime);
    g.gain.linearRampToValueAtTime(.18-i*.04,actx.currentTime+2.5+i*.4);
    o.connect(g);g.connect(masterG);o.start();
  });
  [440,493.9,554.4,659.3,739.9,880,739.9,659.3,554.4,440].forEach((f,i)=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle';o.frequency.value=f;
    const t=actx.currentTime+5+i*2.2;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.3);
    g.gain.setValueAtTime(.1,t+1.7);g.gain.linearRampToValueAtTime(0,t+2.2);
    o.connect(g);g.connect(masterG);o.start(t);o.stop(t+2.3);
  });
}
function playOK(){if(!actx||muted)return;[523.2,659.3,783.9,1046.5].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;const t=actx.currentTime+i*.18;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.08);g.gain.exponentialRampToValueAtTime(.001,t+1);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+1.1);});}
function playCrash(){if(!actx||muted)return;const b=actx.createBuffer(1,actx.sampleRate*.6,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*.1));const s=actx.createBufferSource(),g=actx.createGain();s.buffer=b;g.gain.value=.28;s.connect(g);g.connect(actx.destination);s.start();}
function playBeep(){if(!actx||muted)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.15);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.17);}

document.getElementById('muteBtn').addEventListener('click',function(){
  muted=!muted;this.textContent=muted?'🔇':'🔊';
  if(masterG)masterG.gain.setTargetAtTime(muted?0:.15,actx.currentTime,.3);
});

// ═══════════════════════════════════════════════════════
// CONTRÔLES
// ═══════════════════════════════════════════════════════
const K={up:0,down:0,left:0,right:0,boost:0};
document.addEventListener('keydown',e=>{
  if(!audioOn)initAudio();
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Shift:'boost'};
  if(m[e.key]){K[m[e.key]]=1;e.preventDefault();}
});
document.addEventListener('keyup',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Shift:'boost'};
  if(m[e.key])K[m[e.key]]=0;
});
const isTch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function bindT(id,key){
  const el=document.getElementById(id);
  const set=v=>{K[key]=v?1:0;el.classList.toggle('on',v);};
  el.addEventListener('touchstart',e=>{e.preventDefault();if(!audioOn)initAudio();set(true);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();set(false);},{passive:false});
  el.addEventListener('touchcancel',()=>set(false));
}
if(isTch){
  document.getElementById('tctl').style.display='block';
  document.getElementById('hint').style.display='none';
  ['tU','tD','tL','tR'].forEach((id,i)=>bindT(id,['up','down','left','right'][i]));
}

// ═══════════════════════════════════════════════════════
// MISE À JOUR VOL
// ═══════════════════════════════════════════════════════
function update(dt){
  pitch+=((K.up-K.down)*.55-pitch)*Math.min(1,dt*3);
  pitch=Math.max(-.55,Math.min(.55,pitch));
  roll+=((K.left-K.right)*.7-roll)*Math.min(1,dt*3);
  roll=Math.max(-.7,Math.min(.7,roll));
  yaw+=roll*dt*.8;
  const tgt=(K.boost?MAX_SPD:30)-pitch*18;
  speed+=(tgt-speed)*Math.min(1,dt*1.2);
  speed=Math.max(MIN_SPD,Math.min(MAX_SPD,speed));
  const fx=Math.cos(yaw),fz=Math.sin(yaw),fy=Math.sin(pitch)*.6;
  const fl=Math.sqrt(fx*fx+fy*fy+fz*fz);
  px+=fx/fl*speed*dt; py+=fy/fl*speed*dt; pz+=fz/fl*speed*dt;
  totalDist+=speed*dt;
  vertSpd=(py-prevPY)/Math.max(dt,.001); prevPY=py;
  if(py<=1.2){checkLand();if(!landDone){py=1.2;if(Math.abs(pitch)>.15||speed>35)doEnd(false,'sol');}}
  py=Math.min(py,270);
  propAngle+=dt*speed*1.8;
  // Caméra lerp
  const ox=-10*Math.cos(yaw),oz=-10*Math.sin(yaw);
  camX+=(px+ox-camX)*Math.min(1,dt*3.5);
  camY+=(py+3.5-camY)*Math.min(1,dt*3.5);
  camZ+=(pz+oz-camZ)*Math.min(1,dt*3.5);
  lkX+=(px+5*Math.cos(yaw)-lkX)*Math.min(1,dt*3.5);
  lkY+=(py+.5-lkY)*Math.min(1,dt*3.5);
  lkZ+=(pz+5*Math.sin(yaw)-lkZ)*Math.min(1,dt*3.5);
  updateHUD(dt);
  recycleTiles();
  recycleDeco();
}

function checkLand(){
  if(landDone)return;
  const dx=px-RWX,dz=pz-RWZ;
  const along=dx*rwCos+dz*rwSin;
  const lat=Math.abs(-dx*rwSin+dz*rwCos);
  if(Math.abs(along)>RWLEN/2||lat>RWWID/2+1.5){doEnd(false,'hors');return;}
  landDone=true;
  const pd=Math.abs(pitch*180/Math.PI);
  const fd=[Math.cos(yaw),Math.sin(yaw)];
  let al=Math.acos(Math.min(1,Math.max(-1,fd[0]*rwCos+fd[1]*rwSin)))*180/Math.PI;
  al=Math.min(al,180-al);
  if(Math.abs(vertSpd)<=LV&&pd<=LP&&al<=LA&&lat<=LL)doEnd(true);
  else{let c='vit';if(pd>LP)c='pitch';else if(al>LA)c='align';else if(lat>LL)c='sol';doEnd(false,c);}
}

function doEnd(ok,cat){
  if(crashed)return; crashed=true; gameRunning=false;
  document.getElementById('lhud').style.display='none';
  if(ok){
    playOK();
    const b=document.getElementById('banner');
    b.innerHTML='🛬 '+rnd(OKMsgs)+'<br><span style="font-size:13px;opacity:.7">Appuie sur Redécoller pour repartir</span>';
    b.style.display='block';
    setTimeout(()=>{
      b.style.display='none';
      document.getElementById('rtitle').textContent='✈ Posé !';
      document.getElementById('rtitle').style.color='#7effa0';
      document.getElementById('rmsg').textContent=rnd(OKMsgs);
      document.getElementById('rsub').textContent=Math.round(totalDist)+' m · Beau travail.';
      document.getElementById('result').style.display='flex';
    },2200);
  } else {
    playCrash();
    document.getElementById('rtitle').textContent='💥 Crash';
    document.getElementById('rtitle').style.color='#ff7878';
    document.getElementById('rmsg').textContent=rnd(CMsgs[cat]||CMsgs.sol);
    document.getElementById('rsub').textContent=Math.round(totalDist)+' m parcourus.';
    document.getElementById('result').style.display='flex';
  }
}

function resetFlight(){
  px=0;py=40;pz=0;pitch=0;roll=0;yaw=0;speed=28;
  totalDist=0;vertSpd=0;prevPY=40;crashed=false;landDone=false;
  inApproach=false;beepT=0;gameRunning=true;
  document.getElementById('result').style.display='none';
  document.getElementById('banner').style.display='none';
  document.getElementById('lhud').style.display='none';
}
document.getElementById('rbtn').addEventListener('click',()=>{if(!audioOn)initAudio();resetFlight();});

function updateHUD(dt){
  document.getElementById('altV').textContent=Math.round(py*3)+' m';
  document.getElementById('spdV').textContent=Math.round(speed*6)+' km/h';
  const dx=RWX-px,dz=RWZ-pz,dH=Math.sqrt(dx*dx+dz*dz);
  let rel=((Math.atan2(dz,dx)-yaw)*180/Math.PI+540)%360-180;
  document.getElementById('carr').style.transform='rotate('+rel+'deg)';
  document.getElementById('cdist').textContent=Math.round(dH)+' m';
  if(dH<APPR&&!inApproach){inApproach=true;document.getElementById('lhud').style.display='block';playBeep();}
  if(dH>=APPR&&inApproach&&!landDone){inApproach=false;document.getElementById('lhud').style.display='none';}
  if(inApproach){
    beepT+=dt;if(beepT>4){beepT=0;playBeep();}
    const el1=document.getElementById('lvs'); el1.textContent=(-vertSpd*3).toFixed(1)+' m/s'; el1.className=Math.abs(vertSpd)<=LV?'ok':'bad';
    const el2=document.getElementById('lpt'); el2.textContent=(pitch*180/Math.PI).toFixed(1)+'°'; el2.className=Math.abs(pitch*180/Math.PI)<=LP?'ok':'bad';
    const fd=[Math.cos(yaw),Math.sin(yaw)];
    let al=Math.acos(Math.min(1,Math.max(-1,fd[0]*rwCos+fd[1]*rwSin)))*180/Math.PI;
    al=Math.min(al,180-al);
    const el3=document.getElementById('lal'); el3.textContent=al.toFixed(1)+'°'; el3.className=al<=LA?'ok':'bad';
  }
}

function recycleTiles(){
  TILES.forEach(t=>{
    while(t.x<px-TILE*2.5)t.x+=TILE*TG; while(t.x>px+TILE*2.5)t.x-=TILE*TG;
    while(t.z<pz-TILE*2.5)t.z+=TILE*TG; while(t.z>pz+TILE*2.5)t.z-=TILE*TG;
  });
}
function recycleDeco(){
  const R=400;
  TREES.forEach(t=>{ if(t.x<px-R)t.x+=R*2;if(t.x>px+R)t.x-=R*2;if(t.z<pz-R)t.z+=R*2;if(t.z>pz+R)t.z-=R*2; });
  CLOUDS.forEach(c=>{ if(c.x<px-500)c.x+=1000;if(c.x>px+500)c.x-=1000;if(c.z<pz-500)c.z+=1000;if(c.z>pz+500)c.z-=1000; });
}

// ═══════════════════════════════════════════════════════
// DESSIN DE LA SCÈNE
// ═══════════════════════════════════════════════════════
function drawScene(){
  // Construire la matrice de vue
  VIEW=buildView(camX,camY,camZ, lkX,lkY,lkZ);

  // ── Ciel + Sol (fond 2D avec horizon correct) ──────
  // Projeter un point très loin au niveau du sol pour trouver la ligne d'horizon
  const farX=camX+(lkX-camX)*1000, farZ=camZ+(lkZ-camZ)*1000;
  const farV=applyM(VIEW,[farX,0,farZ]);
  let horizonY = CY;
  if(farV[2]>0.1) horizonY = CY - farV[1]/farV[2]*FOCAL;
  horizonY = Math.max(0, Math.min(H, horizonY));

  // Ciel
  const skyG=ctx.createLinearGradient(0,0,0,horizonY);
  skyG.addColorStop(0,'#0d1e3a'); skyG.addColorStop(0.65,'#1a3a6a'); skyG.addColorStop(1,'#f5904a');
  ctx.fillStyle=skyG; ctx.fillRect(0,0,W,horizonY);
  // Sol de fond
  const gndG=ctx.createLinearGradient(0,horizonY,0,H);
  gndG.addColorStop(0,'#8ab84a'); gndG.addColorStop(1,'#4a7020');
  ctx.fillStyle=gndG; ctx.fillRect(0,horizonY,W,H-horizonY);

  // Piste
  {
    const rm=mulM(translate(RWX,.05,RWZ),rotY(-RWHDG));
    drawPlane(rm,RWLEN,RWWID,'#2e3337');
    for(let i=0;i<9;i++){
      const ox=(-RWLEN/2+6+i*9)*rwCos,oz=(-RWLEN/2+6+i*9)*rwSin;
      drawPlane(mulM(translate(RWX+ox,.07,RWZ+oz),rotY(-RWHDG)),4,.8,'#e8e8e8');
    }
    [-RWWID/2+.4,RWWID/2-.4].forEach(z=>{
      const ex=-z*rwSin,ez=z*rwCos;
      drawPlane(mulM(translate(RWX+ex,.07,RWZ+ez),rotY(-RWHDG)),RWLEN,.5,'#e8e8e8');
    });
    for(let z=-5;z<=5;z+=2){
      const tx=(-RWLEN/2+3)*rwCos-z*rwSin,tz=(-RWLEN/2+3)*rwSin+z*rwCos;
      drawPlane(mulM(translate(RWX+tx,.07,RWZ+tz),rotY(-RWHDG)),5,.7,'#f0d020');
    }
    // Tour de contrôle
    drawCylinder(mulM(translate(RWX,4,RWZ+RWWID/2+9),scaleM(1,1,1)),1.2,8,8,42,30,55);
    drawBox(mulM(translate(RWX,9.5,RWZ+RWWID/2+9),identity()),4.4,2,4.4,195,50,60,0.85);
  }

  // Arbres
  TREES.forEach(t=>{
    const s=t.s;
    // Tronc : cylindre vertical
    drawCylinder(mulM(translate(t.x,1.5*s,t.z),scaleM(s,s,s)),0.35,3,6,30,40,30);
    // Feuillage : cône (pointe vers le haut = Y+), base en bas
    // drawCone place la pointe à Y=h et la base à Y=0 en local
    // Donc on translate à la base du cône (y du sol du feuillage)
    drawCone(mulM(translate(t.x,3*s,t.z),scaleM(s,s,s)),2.0,4.5,8,115,50,32);
  });

  // Nuages
  CLOUDS.forEach(c=>{
    c.puffs.forEach(p=>{
      const m=mulM(translate(c.x+p.dx,c.y+p.dy,c.z+p.dz),scaleM(p.r,p.r*.55,p.r*.7));
      drawCylinder(m,1,1,10,25,20,90);
    });
  });

  // ── Avion ──────────────────────────────────────────
  // Matrice de base de l'avion (position + orientation)
  const planeBase = mulM(
    mulM(mulM(translate(px,py,pz), rotY(-yaw)), rotX(-pitch*.9)), rotZ(-roll)
  );

  // Fuselage
  drawCylinder(mulM(planeBase,mulM(rotZ(Math.PI/2),scaleM(1,1,1))),0.55,4.2,10,210,15,80);
  // Nez/capot
  drawCone(mulM(planeBase,mulM(translate(2.55,0,0),rotZ(-Math.PI/2))),0.55,0.9,10,210,10,65);
  // Aile haute
  drawBox(mulM(planeBase,translate(.1,.55,0)),0.9,.1,5.6,200,55,60);
  // Aile basse
  drawBox(mulM(planeBase,translate(.1,-.45,0)),0.9,.1,5.6,200,50,50);
  // Dérive verticale
  drawBox(mulM(planeBase,translate(-1.95,.55,0)),.06,1.0,.8,200,50,50);
  // Stabilisateur
  drawBox(mulM(planeBase,translate(-1.95,.05,0)),.06,.08,1.8,210,10,65);
  // Cockpit (boîte sombre translucide)
  drawBox(mulM(planeBase,translate(.6,.45,0)),.5,.4,.6,210,20,25,0.85);

  // Hélice (2 pales tournantes)
  const pa=propAngle;
  const pBase=mulM(planeBase,translate(3.05,0,0));
  const b1=mulM(pBase,rotX(pa));
  const b2=mulM(pBase,rotX(pa+Math.PI/2));
  drawBox(b1,.06,1.1,.12,0,0,15);
  drawBox(b2,.06,1.1,.12,0,0,15);

  // Train d'atterrissage
  [-0.9,0.9].forEach(z=>{
    drawBox(mulM(planeBase,translate(.3,-.75,z)),.08,.5,.08,0,0,35);
    drawCylinder(mulM(planeBase,mulM(translate(.3,-1.0,z),rotX(Math.PI/2))),.18,.14,8,0,0,20);
  });
}

// ═══════════════════════════════════════════════════════
// BOUCLE PRINCIPALE
// ═══════════════════════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000,.05); lastT=now;
  if(gameRunning) update(dt);
  drawScene();
}

loop();
</script>
